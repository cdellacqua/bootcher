name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to read-only; jobs that need more (e.g. pages) opt in locally.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format, lint, doc, and test. The actual job lives in the reusable verify.yml
  # so this and release.yml's gate can't drift; here we just call it.
  #
  # This workflow deliberately does not trigger on tags; release.yml handles the
  # `v*` tag, and it gates publishing on its own call to verify.yml.
  #
  # `cargo xtask release` pushes the version-bump commit to main and the tag in
  # the same `git push`, so the main push would otherwise run a full verify/audit on a
  # commit that only edits version strings in Cargo.toml/Cargo.lock — redundant
  # work that always passes, racing the release run. We skip it: the `if` below
  # short-circuits CI for those bump commits (matched by their "release v…"
  # message). The tagged commit is still verified — release.yml runs verify.yml
  # as its publish gate — so skipping here costs no safety. `[skip ci]` can't do
  # this: it'd skip the tag's release run too, since the tag points at the same
  # commit. audit `needs` verify, so it skips along with it. pages still publishes
  # on that push: its `if` treats a skipped verify/audit as success, so the
  # release commit that tips `main` doesn't leave the site unpublished. A failed
  # verify or audit still blocks it.
  #
  # The guard only matches push events (head_commit is null on pull_request), so
  # PRs and manual dispatches always run the full suite.
  verify:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release v')
    uses: ./.github/workflows/verify.yml

  # Build and deploy the landing page + mdBook + rustdoc site to GitHub Pages on
  # every push to main. `cargo xtask docs` assembles docs/site/: the landing page
  # at the root, the mdBook under book/, and rustdoc under book/api/. Requires GitHub
  # Pages to be configured with source "GitHub Actions" in the repository settings.
  pages:
    needs: [verify, audit]
    # Publish on a push to main once verify and audit have passed. A release
    # bump skips those two (see the verify job); `always()` keeps this job from
    # being skipped with them, and the result check still refuses a real failure.
    # `always()` is what lets a skipped dependency through — without it GitHub
    # skips this job before the `if` is considered.
    if: |
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.audit.result == 'success' || needs.audit.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Deliberately the *same* key as verify.yml, to ride its cache rather than
      # keep a second one. This job `needs` verify, so by the time we get here
      # verify has saved a target/ full of freshly built dependency rlibs — which
      # is most of the work in the `cargo doc` below, since --no-deps still has to
      # compile the deps it won't document. A separate key would mean building
      # that cold *and* holding a second multi-GB entry against the repo's 10 GB
      # cache quota, where the two would evict each other.
      #
      # The corollary is that mdbook can't be cached: an exact key hit means
      # actions/cache skips the post-job save, so anything this job installs into
      # ~/.cargo/bin/ is discarded. Listing those paths here would be a lie, so we
      # don't — `cargo install` of mdbook and mdbook-mermaid pays a cold build every run, which is the
      # price of the warm target/ and cheaper than the alternative.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install mdbook
        # mdbook-mermaid is required: docs/book.toml runs it as a preprocessor,
        # and the book has no `optional = true`, so a missing binary fails the build.
        run: |
          cargo install mdbook --locked
          cargo install mdbook-mermaid --locked
      - name: Fetch dependencies
        run: cargo fetch --locked
      # See verify.yml for why the offline/locked pinning is split across these
      # two variables.
      - name: Build docs
        env:
          CARGO_NET_OFFLINE: "true"
          BOOTCHER_CARGO_FLAGS: --frozen
        run: cargo xtask docs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site/
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Scan dependencies against the RUSTSEC advisory database. Reads only
  # Cargo.lock, so it needs no system deps.
  audit:
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Cache ~/.cargo/bin/ so the compiled cargo-audit binary is restored
      # across runs; the install step below then becomes a fast no-op. The
      # .crates.toml/.crates2.json ledger is required for `cargo install` to
      # recognize the tool as already installed and skip rebuilding it. No
      # target/ here — this job only runs cargo-audit, it doesn't build the
      # crate. Keyed on Cargo.lock so a dependency change re-resolves the tool.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
