name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to read-only; jobs that need more (e.g. pages) opt in locally.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format, lint, and test on a single Linux host. bootcher is Linux-only
  # (Podman is native Linux), so there's no cross-OS matrix to verify.
  #
  # This workflow deliberately does not trigger on tags: a release tag points at
  # a commit that already landed on main and was verified by this workflow on the
  # main push, so the release workflow (release.yml) only packages/publishes and
  # never re-runs verify/audit. That keeps a release down to one CI run plus one
  # release run, with no redundant or skipped pipelines.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Cache the registry index/cache and git db (not the regenerable
          # extracted ~/.cargo/registry/src), plus the build artifacts. The
          # .crates.toml/.crates2.json ledger lives at the root of ~/.cargo
          # (not under bin/); without it `cargo install` can't tell a tool is
          # already present and rebuilds it even on a cache hit.
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Exact match only: a partial restore could warm-start from artifacts
          # built with a different toolchain/deps and flake the build. Bust the
          # cache when the lockfile or the pinned toolchain changes.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      # Fetch with --locked (needs network, verifies the lockfile is current),
      # then build/test with --frozen so the rest of the run is offline and
      # can't mutate Cargo.lock or pull anything unexpected.
      # Install the `just` task runner so CI runs the exact same recipe a
      # developer runs locally (`just ci`), keeping the two from drifting. Same
      # `cargo install --locked` pattern as cargo-audit below; lands in the
      # cached ~/.cargo/bin/.
      - name: Install just
        run: cargo install just --locked
      - name: Fetch dependencies
        run: cargo fetch --locked
      # cargo_flags=--frozen keeps the run offline and pins Cargo.lock; locally
      # the recipe defaults to no extra flags.
      - name: Verify (just ci)
        run: just cargo_flags=--frozen ci

  # Build and deploy the landing page + mdBook + rustdoc site to GitHub Pages on
  # every push to main. `just docs` assembles docs/site/: the landing page at the
  # root, the mdBook under book/, and rustdoc under book/api/. Requires GitHub
  # Pages to be configured with source "GitHub Actions" in the repository settings.
  pages:
    needs: [verify, audit]
    # Temporarily disabled: GitHub Pages can't be published from a private repo
    # on the Free plan. Re-enable (drop the `false &&`) once the repo is public
    # or the account is on Pro/Team/Enterprise.
    if: false && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install just
        run: cargo install just --locked
      - name: Install mdbook
        run: cargo install mdbook --locked
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Build docs
        run: just cargo_flags=--frozen docs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site/
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Scan dependencies against the RUSTSEC advisory database. Reads only
  # Cargo.lock, so it needs no system deps.
  audit:
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Cache ~/.cargo/bin/ so the compiled cargo-audit binary is restored
      # across runs; the install step below then becomes a fast no-op. The
      # .crates.toml/.crates2.json ledger is required for `cargo install` to
      # recognize the tool as already installed and skip rebuilding it. No
      # target/ here — this job only runs cargo-audit, it doesn't build the
      # crate. Keyed on Cargo.lock so a dependency change re-resolves the tool.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
