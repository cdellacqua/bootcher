name: Release

# Tags only. The version-bump commit and its v* tag are pushed together by
# `cargo xtask release`, so the tagged commit is brand-new and was never verified
# on main first (ci.yml even skips bump commits). The `verify` gate below therefore
# runs the full `xtask ci` suite on the exact tagged commit, and every build/
# publish job `needs` it — so nothing ships if the tagged commit is red.
on:
  push:
    tags: ["v*"]

# Default to read-only; jobs that need more opt in locally.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publish gate: same job ci.yml runs, shared via verify.yml so the two can't
  # drift. release/image both `needs` it, so a failing tagged commit is never
  # packaged or pushed.
  verify:
    uses: ./.github/workflows/verify.yml


  # Build release binaries for the two arches bootcher targets, on native
  # runners (no cross-compilation needed). These legs only build and stash the
  # tarball as a workflow artifact — they do NOT touch the GitHub release. A
  # single downstream job (release-publish) owns the release write, so the two
  # matrix legs can't race to create it and no partial release is ever published.
  # fail-fast is on: if one arch fails the other is cancelled, the job goes red,
  # and release-publish is skipped — we'd rather ship nothing than a half release.
  release:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Build
        run: cargo build --release --frozen -p bootcher-cli
      - name: Package
        run: tar -C target/release -czf bootcher-${{ matrix.target }}.tar.gz bootcher
      - name: Stash artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootcher-${{ matrix.target }}
          path: bootcher-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          # Inter-job scratch, consumed by release-publish in the same run. Keep it
          # off the account's artifact-storage quota by expiring it fast.
          retention-days: 1

  # Single writer to the GitHub release. `needs: release` plus fail-fast means
  # this only runs once BOTH arch tarballs exist, so the release object is created
  # exactly once, with every asset in hand — no create race, no empty release. A
  # non-final tag is marked as a prerelease (see the classify step).
  release-publish:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bootcher-*
          path: dist
          merge-multiple: true
      # Same definition of "final release" as image-manifest's `latest` gate: a
      # plain vX.Y.Z tag. Anything else (v1.2.3-rc1, a throwaway test tag) is
      # published as a GitHub prerelease, so it doesn't become the release page's
      # "Latest release" — matching the fact that it doesn't move the image's
      # `latest` tag either. The test lives in a step because Actions expressions
      # have no regex; the tag goes through the env rather than being interpolated
      # into the script.
      - name: Classify the tag
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not a final release — publishing it as a GitHub prerelease"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.tar.gz
          prerelease: ${{ steps.tag.outputs.prerelease }}

  # Build the per-arch container images and push each to ghcr under an arch-suffixed
  # tag (vX.Y.Z-amd64 / -arm64). The image wraps the Linux-only binary so bootcher
  # can run on macOS/Windows via the Podman/Docker machine VM (see Containerfile +
  # README). Built per-arch on native runners — emulated cross-arch builds are slow
  # and historically flaky. Pushing straight to ghcr, rather than stashing a
  # multi-hundred-MB `podman save` tar as a workflow artifact, keeps these images
  # off the account's Actions artifact-storage quota (which is what previously
  # failed the release). The downstream image-manifest job stitches these arch tags
  # into the multi-arch lists; the arch-suffixed tags stay visible in the package.
  # fail-fast: if one arch fails the other is cancelled and image-manifest is
  # skipped, so no multi-arch list is ever published pointing at a missing arch —
  # though a failed run can leave a lone arch tag pushed with no list (harmless,
  # overwritten next release).
  image:
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ghcr.io requires a lowercase repo path; github.repository preserves the
      # owner's casing, so normalize it once into the job env.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      # Native build for this runner's arch; the arch-suffixed tag keeps the two
      # images distinct in the registry until image-manifest merges them.
      - name: Build
        run: podman build --platform linux/${{ matrix.arch }} -f Containerfile -t "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}" .
      - name: Log in to ghcr.io
        run: echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Push arch image
        run: podman push "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}"

  # Assembles the multi-arch manifest lists. `needs: image` plus fail-fast means
  # this runs only once both arch tags exist in ghcr. It stitches vX.Y.Z-amd64 and
  # vX.Y.Z-arm64 into a list tagged `vX.Y.Z` — plus `latest` when the tag is a
  # final release (see the gate below) — so `podman pull ghcr.io/<owner>/bootcher`
  # resolves to the puller's architecture. Members are pulled straight from ghcr by
  # reference, so nothing round-trips through a workflow artifact.
  image-manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        run: echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
      # Members are added with an explicit docker:// transport so podman pulls the
      # arch manifests straight from ghcr — the arch tags the image job just pushed.
      # `push --all` then uploads the list and re-references its per-arch members by
      # digest.
      - name: Create and push manifests
        shell: bash
        run: |
          version="${{ github.ref_name }}"
          # Every v* tag runs this workflow, so `latest` must be gated on the tag
          # being a final release: a prerelease or throwaway test tag (v1.2.3-rc1,
          # v1.2.3-test1) would otherwise repoint `latest` at a build nobody should
          # get by default, and `podman pull ghcr.io/<owner>/bootcher` has no way to
          # know it happened. The version tag is always published.
          tags=("$version")
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags+=(latest)
          else
            echo "::notice::$version is not a final release — publishing the version tag only, leaving latest untouched"
          fi
          for tag in "${tags[@]}"; do
            podman manifest create "$IMAGE:$tag"
            podman manifest add "$IMAGE:$tag" "docker://$IMAGE:$version-amd64"
            podman manifest add "$IMAGE:$tag" "docker://$IMAGE:$version-arm64"
            podman manifest push --all "$IMAGE:$tag" "docker://$IMAGE:$tag"
            podman manifest rm "$IMAGE:$tag"
          done
