# bootcher CI with RELEASE CHANNELS — GitHub Actions BUILD + DEPLOY half, multi-arch.
#
# A channels-aware variant of ../../github-actions/deploy.yml. The job *shape* is
# identical — build (per-arch, native runners) → deploy (assemble + push) — plus the
# loopback container store and the `changes` path gate, so this header only covers what's
# DIFFERENT: which channel each trigger publishes to. For the store relocation, the
# per-arch split rationale, and the secrets, read ../../github-actions/deploy.yml and
# ../../README.md; nothing there changes. The disk build is the sibling provision.yml.
#
#   push to main  → deploy to the default `latest` channel  (rolling / canary fleet)
#   push a v* tag → deploy to the `stable` channel          (production fleet)
#
# THE MECHANISM (see ../../../../docs/src/reference/bootcher-toml.md#channels). A channel
# is a mutable registry tag `<registry>/<name>:<channel>` that a SUBSET of devices
# tracks. `bootcher deploy --channel stable` pushes the multi-arch list under :stable
# instead of :latest, so only devices whose bootc origin is :stable pick it up. Every
# deploy ALSO stamps that same digest with its immutable :CalVer tag regardless of
# channel — so the version tag is the durable rollback/audit handle and the channel is
# just a moving pointer to "what that audience sees now".
#
# THE PROMOTION MODEL this encodes:
#   - Every merge to main publishes :latest. Devices provisioned on the default channel
#     (your dev boxes / QA rigs) auto-update to it on their timer — that's the canary.
#   - When a commit on main has proven good, tag it `vX.Y.Z`. The tag pipeline rebuilds
#     THAT commit and publishes it to :stable; production devices (provisioned with
#     `--channel stable`) only now auto-update. The tag is on the same source commit, so
#     stable is that validated revision, and `git describe` stamps `vX.Y.Z` as its
#     version label. (bootcher rebuilds on the tag rather than re-tagging main's exact
#     digest — same source, fresh CalVer; the immutable CalVer tag is the per-build
#     identity either way. If you need bit-identical promotion, pull main's CalVer image
#     and `podman manifest push` it to :stable by hand instead of tagging.)
#
# bootcher.toml must DECLARE the channel so `--channel stable` validates — a typo'd
# channel is rejected, not silently minted as a stray tag:
#
#   [deploy]
#   registry = "ghcr.io/<owner>"     # lowercase; image is ghcr.io/<owner>/<name>
#   channels = ["stable"]            # the named channel beyond the implicit `latest`
#
#   [targets]
#   x86_64  = "qcow2"
#   aarch64 = "raw"
#
# The provision.yml sibling bakes whichever channel you pick into the disk, so a
# stable-tracking or latest-tracking device is a matter of which channel you dispatch it
# with. Secrets/variables and the `bootcher.ci.toml` override are unchanged — see
# ../../README.md.

name: bootcher deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

# TODO: set IMAGE to your OS image ref — <registry>/<name>, the same ghcr.io/<owner>/<name>
# your bootcher.toml `[deploy] registry` + project name resolve to (lowercase). `build`
# pushes each per-arch member here under a scratch :ci-<arch> tag and `deploy` pulls it
# (see ../../github-actions/deploy.yml for why the registry, not a run artifact). Uncomment
# and fill it in: the build/deploy scripts guard on it and fail loudly until you do.
# Channel-agnostic: the scratch tag is CI-internal handoff, unrelated to the :latest /
# :stable channel tags `deploy` publishes.
# env:
#   IMAGE: ghcr.io/<owner>/<name>

jobs:
  # --- changes: did anything that affects the image actually change? ----------------
  # Identical to the base recipe: an allowlist of image inputs; a `v*` tag bypasses it
  # in `build.if`. Adjust the list to your project.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - Containerfile
              - sysroot/**
              - bootcher.toml
              - bootcher.ci.toml
              - .github/workflows/bootcher-deploy.yml

  # --- build: one container per arch, on a native-arch runner -----------------------
  # Same as the base recipe — channel-agnostic (it pushes the member to a scratch tag
  # <image>:ci-<arch>; see ../../github-actions/deploy.yml for why the registry, not a run
  # artifact). The member is the same whether deploy later publishes it to :latest or
  # :stable; the channel is chosen only at push time, in `deploy`.
  build:
    needs: [changes]
    if: needs.changes.outputs.image == 'true' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm } # native arm64 runner, no emulation
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push each per-arch member to the registry (was artifact-only)
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # Real-fs container store (loopback ext4 so podman does one kernel overlay instead
      # of fuse-overlayfs-on-overlay). Self-skips on a real fs. Full rationale: the
      # header of ../../github-actions/deploy.yml.
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      - name: Build ${{ matrix.arch }}
        # Guard IMAGE now (see the TODO up top) so a misconfigured run fails here, before
        # the multi-minute build, instead of later at the push step.
        run: |
          test -n "${IMAGE:-}" || { echo "IMAGE is unset — uncomment it at the top of this workflow and set your <registry>/<name> ref (see the TODO)"; exit 1; }
          bootcher --manifest bootcher.ci.toml build --target "${{ matrix.arch }}"
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image member to the registry
        # Push the just-built member under a scratch tag ($IMAGE:ci-<arch>) that `deploy`
        # pulls — the handoff goes through the registry, not a run artifact (see
        # ../../github-actions/deploy.yml). Channel-agnostic: this scratch tag is unrelated
        # to the :latest/:stable channel tags. Unsigned; only the channel tag is signed.
        run: |
          set -eu
          img="$(podman images --format '{{.Repository}}:{{.Tag}}' | grep ":latest-${{ matrix.arch }}\$" | head -n1)"
          test -n "$img" || { echo "no built image tagged :latest-${{ matrix.arch }}"; exit 1; }
          scratch="$IMAGE:ci-${{ matrix.arch }}"
          podman tag "$img" "$scratch"
          podman push "$scratch"

  # --- deploy: assemble the members and push to THIS RUN's channel ------------------
  # Same as the base recipe, except the channel is chosen by the trigger: a `v*` tag
  # publishes to `stable`, anything else (a main push) to the default `latest`. The
  # `CHANNEL` env resolves to `stable` only on a tag ref; when it's empty we omit the
  # flag entirely, so bootcher uses its built-in `latest` default (and never has to be
  # told a channel for the common case).
  deploy:
    needs: [build] # waits for every matrix arch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pull each per-arch member `build` pushed under its scratch tag and retag it to the
      # local name `deploy --skip-build` expects — localhost/<name>:latest-<arch>, <name>
      # = $IMAGE's basename — so the list is assembled from them as before, just sourced
      # from the registry, not a run artifact. Keep this arch list in sync with the matrix.
      - name: Pull image members from the registry
        run: |
          set -eu
          test -n "${IMAGE:-}" || { echo "IMAGE is unset — uncomment it at the top of this workflow and set your <registry>/<name> ref (see the TODO)"; exit 1; }
          for arch in x86_64 aarch64; do
            scratch="$IMAGE:ci-$arch"
            podman pull "$scratch"
            podman tag "$scratch" "localhost/${IMAGE##*/}:latest-$arch"
          done
      # Signing? Materialise the cosign key `[deploy] registry.key` points at:
      # - run: printf '%s' "$SIGN_KEY" > cosign.key
      #   env: { SIGN_KEY: "${{ secrets.SIGN_KEY }}" }
      - name: Deploy to channel
        # The members were pulled + retagged above; assemble + push under this run's
        # channel. `--channel` is added only on a tag (CHANNEL=stable); a main push leaves
        # it empty and falls through to bootcher's `latest` default. `--skip-bootc-upgrade`
        # leaves the rollout to each device's auto-update timer (see ../../README.md).
        run: |
          set -eu
          if [ -n "${CHANNEL:-}" ]; then
            echo "deploying to channel: $CHANNEL"
            bootcher --manifest bootcher.ci.toml deploy --skip-build --skip-bootc-upgrade --channel "$CHANNEL"
          else
            echo "deploying to default channel: latest"
            bootcher --manifest bootcher.ci.toml deploy --skip-build --skip-bootc-upgrade
          fi
        env:
          # tag (refs/tags/v*) → stable; main push → empty → bootcher's default `latest`.
          CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || '' }}
          BOOTCHER_SIGN_PASSPHRASE: ${{ secrets.SIGN_PASSPHRASE }}
