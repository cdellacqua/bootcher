# bootcher CI with RELEASE CHANNELS — GitHub Actions BUILD + DEPLOY half, multi-arch.
#
# A channels-aware variant of ../../github-actions/deploy.yml. The job *shape* is
# identical — build (per-arch, native runners) → deploy (assemble + push) → cleanup (prune
# old versions) — plus the loopback container store, the `changes` path gate, and the
# runtime `bootcher info` image-ref derivation, so this header only covers what's
# DIFFERENT: which channel each trigger publishes to. For the store relocation, the
# per-arch split rationale, the cleanup mechanics, and the secrets, read
# ../../github-actions/deploy.yml and ../../README.md; nothing there changes. The disk
# build is the sibling provision.yml.
#
#   push to main             → deploy to the default `latest` channel (rolling / canary)
#   push a v* tag            → deploy to the `stable` channel         (production fleet)
#   Saturday schedule        → refresh `latest`                       (base-image updates)
#   Tuesday schedule         → refresh `stable`                       (base-image updates)
#   manual run on main/a tag → rebuild it into `latest` / `stable`, unconditionally
#
# A refresh rebuilds the exact commit its channel currently ships — read from the
# `org.opencontainers.image.revision` label bootcher stamps on every image — on today's
# base. So it never ships unreleased source, and it works for any channel whatever feeds
# it (tags, a branch, a hand-pushed rollback). The schedules are staggered so the canary
# fleet runs a new Fedora base for a few days before production gets it; each skips the
# build when the base hasn't moved since its channel was last published (see the
# `changes` job). Adding a channel? Give it a cron line and an entry in SCHEDULES there.
#
# THE MECHANISM (see ../../../../docs/src/reference/bootcher-toml.md#channels). A channel
# is a mutable registry tag `<registry>/<name>:<channel>` that a SUBSET of devices
# tracks. `bootcher deploy --channel stable` pushes the multi-arch list under :stable
# instead of :latest, so only devices whose bootc origin is :stable pick it up. Every
# deploy ALSO stamps that same digest with its immutable :CalVer tag regardless of
# channel — so the version tag is the durable rollback/audit handle and the channel is
# just a moving pointer to "what that audience sees now".
#
# THE PROMOTION MODEL this encodes:
#   - Every merge to main publishes :latest. Devices provisioned on the default channel
#     (your dev boxes / QA rigs) auto-update to it on their timer — that's the canary.
#   - When a commit on main has proven good, tag it `vX.Y.Z`. The tag pipeline rebuilds
#     THAT commit and publishes it to :stable; production devices (provisioned with
#     `--channel stable`) only now auto-update. The tag is on the same source commit, so
#     stable is that validated revision, and `git describe` stamps `vX.Y.Z` as its
#     version label. (bootcher rebuilds on the tag rather than re-tagging main's exact
#     digest — same source, fresh CalVer; the immutable CalVer tag is the per-build
#     identity either way. If you need bit-identical promotion, pull main's CalVer image
#     and `podman manifest push` it to :stable by hand instead of tagging.)
#
# bootcher.toml must DECLARE the channel so `--channel stable` validates — a typo'd
# channel is rejected, not silently minted as a stray tag:
#
#   [deploy]
#   registry = "ghcr.io/<owner>"     # lowercase; image is ghcr.io/<owner>/<name>
#   channels = ["stable"]            # the named channel beyond the implicit `latest`
#
#   [targets]
#   x86_64  = "qcow2"
#   aarch64 = "raw"
#
# The provision.yml sibling bakes whichever channel you pick into the disk, so a
# stable-tracking or latest-tracking device is a matter of which channel you dispatch it
# with. Secrets/variables and the `bootcher.ci.toml` override are unchanged — see
# ../../README.md.

name: bootcher deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Weekly per-channel base-image refreshes, each skipped when the base hasn't moved (see
  # the header and the base recipe's `schedule:` comment for the caveats). The `changes`
  # job maps each cron string to its channel (SCHEDULES), so a retimed or added line must
  # be mirrored there exactly.
  schedule:
    - cron: "17 3 * * 6" # Saturday: latest
    - cron: "17 3 * * 2" # Tuesday: stable
  workflow_dispatch:

# One run at a time (shared <image>:ci-<arch> scratch tags), queued rather than cancelled.
concurrency:
  group: bootcher-deploy
  cancel-in-progress: false

# No image ref to configure: each job derives it from bootcher.toml at runtime with
# `bootcher info` (see the "Resolve image ref" steps), same as the base recipe. The scratch
# tag it builds is channel-agnostic — a CI-internal handoff unrelated to the :latest /
# :stable channel tags `deploy` publishes.
env:
  # cleanup keeps :latest/:stable + this many previous immutable CalVer releases; older
  # ones (and the per-arch layers only they referenced) are pruned after a successful
  # deploy. CalVer tags are shared across channels, so one knob covers both fleets; with
  # both schedules firing, that's up to two releases a week.
  KEEP_PREVIOUS: "5"

jobs:
  # --- changes: did anything that affects the image actually change? ----------------
  # Like the base recipe: an allowlist of image inputs; a `v*` tag bypasses it in
  # `build.if`. A manual run always builds; a scheduled one builds only if the base image
  # moved since its channel was last published (the last step; see the base recipe).
  # Adjust the list to your project. It also decides which channel this run publishes to,
  # and which commit build/deploy check out (outputs `channel` and `ref`).
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # the base-image check reads the published image
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      ref: ${{ steps.base.outputs.ref }}
      # push → the path filter; schedule → the base-image check; manual → always.
      image: >-
        ${{ github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && steps.filter.outputs.image == 'true')
        || (github.event_name == 'schedule' && steps.base.outputs.changed == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - Containerfile
              - sysroot/**
              - bootcher.toml
              - bootcher.ci.toml
              - .github/workflows/bootcher-deploy.yml
      # Which channel this run publishes to. A schedule → the channel SCHEDULES maps its
      # cron string to (one `<channel> <cron>` per line, mirroring `schedule:`). A tag ref
      # (a `v*` push, or a manual run on a tag) → `stable`. Anything else → empty, i.e.
      # bootcher's default `latest`. Map your own channels to triggers here.
      - name: Resolve channel
        id: channel
        run: |
          set -eu
          channel=''
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            while read -r ch cron; do
              if [ "$cron" = "$SCHEDULE" ]; then channel="$ch"; fi
            done <<< "$SCHEDULES"
            test -n "$channel" || { echo "::error::no SCHEDULES entry for cron '$SCHEDULE'"; exit 1; }
            if [ "$channel" = latest ]; then channel=''; fi
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            channel=stable
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        env:
          SCHEDULE: ${{ github.event.schedule }}
          SCHEDULES: |
            latest 17 3 * * 6
            stable 17 3 * * 2
      # Scheduled runs only: skip the rebuild when the base image hasn't moved since the
      # published one was built. buildah stamps every built image with the base it came
      # FROM (`org.opencontainers.image.base.name` — ARGs already resolved — and
      # `.base.digest`, the per-arch manifest digest), and those annotations survive into
      # the published members. So for each published arch, compare that digest with the
      # base tag's current one for the same arch; any difference — or anything that can't
      # be checked (first run, an image built before this check, a registry hiccup) —
      # rebuilds, so a failure here never costs a security update. A manual run always
      # rebuilds: use it for package updates your Containerfile layers on top, which are
      # otherwise only picked up when the base itself moves. The ref comes from `bootcher
      # info` (as in the other jobs), run from the published image; skopeo is on the runner.
      # A private base image needs its own `skopeo login`.
      #
      # It also picks the commit to rebuild: the `org.opencontainers.image.revision` label
      # of the image the channel currently ships, so the refresh is the same source on a
      # new base. With no usable label (an image built before bootcher v0.2.6 shipped git,
      # or deployed from a dirty tree), `latest` falls back to the triggering ref (main);
      # any other channel fails the run rather than guess what to ship — publish it once
      # the normal way (or with a manual run) and the next refresh has a label to follow.
      - name: Check whether the base image moved
        if: github.event_name == 'schedule'
        id: base
        run: |
          set -eu
          rebuild() { echo "rebuilding: $*"; echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; }
          IMAGE="$(docker run --rm -v "$PWD:/w" -w /w ghcr.io/cdellacqua/bootcher:latest \
            --manifest bootcher.ci.toml info --format '{{ .Image }}')"
          test -n "$IMAGE" || { echo "no registry in bootcher.toml [deploy] — these CI recipes are registry-mode only (see README)"; exit 1; }
          TAG="$IMAGE:${CHANNEL:-latest}" # the channel this run refreshes
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if ! index="$(skopeo inspect --raw "docker://$TAG")"; then
            test -z "$CHANNEL" || { echo "nothing published to $TAG yet: nothing to refresh"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
            rebuild "no published $TAG to compare against"
          fi
          # The commit the channel ships (every arch member carries the same label).
          first="$(jq -r 'first(.manifests[] | select(.platform.architecture != "unknown") | .digest)' <<<"$index")"
          rev="$(skopeo inspect --config "docker://$IMAGE@$first" | jq -r '.config.Labels."org.opencontainers.image.revision" // empty')" || rev=''
          case "$rev" in
            ''|*-dirty)
              if [ -n "$CHANNEL" ]; then
                echo "::error::$TAG records no clean source revision ('$rev'), so there's no telling what to rebuild — publish it once with a normal deploy or a manual run"
                exit 1
              fi
              echo "$TAG records no clean source revision ('$rev'): refreshing from $GITHUB_REF" ;;
            *)
              echo "$TAG ships $rev"
              echo "ref=$rev" >> "$GITHUB_OUTPUT" ;;
          esac
          for digest in $(jq -r '.manifests[] | select(.platform.architecture != "unknown") | .digest' <<<"$index"); do
            arch="$(jq -r --arg d "$digest" '.manifests[] | select(.digest == $d) | .platform.architecture' <<<"$index")"
            annotations="$(skopeo inspect --raw "docker://$IMAGE@$digest" | jq -c '.annotations // {}')" \
              || rebuild "$arch: can't read the published member"
            base="$(jq -r '."org.opencontainers.image.base.name" // empty' <<<"$annotations")"
            built="$(jq -r '."org.opencontainers.image.base.digest" // empty' <<<"$annotations")"
            { [ -n "$base" ] && [ -n "$built" ]; } || rebuild "$arch: the published image records no base"
            raw="$(skopeo inspect --raw "docker://$base")" || rebuild "$arch: can't inspect $base"
            current="$(jq -r --arg a "$arch" 'first(.manifests[]? | select(.platform.architecture == $a) | .digest) // empty' <<<"$raw")"
            [ -n "$current" ] || current="$(skopeo inspect --format '{{.Digest}}' "docker://$base")" \
              || rebuild "$arch: can't inspect $base"
            [ "$current" = "$built" ] || rebuild "$arch: $base moved ($built -> $current)"
            echo "$arch: $base unchanged ($built)"
          done
          echo "base image unchanged since the last publish: skipping the rebuild"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}

  # --- build: one container per arch, on a native-arch runner -----------------------
  # Same as the base recipe — channel-agnostic (it pushes the member to a scratch tag
  # <image>:ci-<arch>; see ../../github-actions/deploy.yml for why the registry, not a run
  # artifact). The member is the same whether deploy later publishes it to :latest or
  # :stable; the channel is chosen only at push time, in `deploy`. On a refresh it checks
  # out the commit `changes` resolved (empty otherwise: the triggering ref).
  build:
    needs: [changes]
    if: needs.changes.outputs.image == 'true' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm } # native arm64 runner, no emulation
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push each per-arch member to the registry (was artifact-only)
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.ref }}
          # Tags too, so a refresh checked out by commit still gets its release name from
          # `git describe` (the version label), as on a tag push.
          fetch-tags: true
      # Real-fs container store (loopback ext4 so podman does one kernel overlay instead
      # of fuse-overlayfs-on-overlay). Self-skips on a real fs. Full rationale: the
      # header of ../../github-actions/deploy.yml.
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      - name: Resolve image ref
        # Derive the ref from bootcher.toml (see ../../github-actions/deploy.yml): IMAGE is
        # the base for the :ci-<arch> scratch tags. Empty ⇒ LAN mode; registry-mode only.
        run: |
          set -eu
          image="$(bootcher --manifest bootcher.ci.toml info --format '{{ .Image }}')"
          test -n "$image" || { echo "no registry in bootcher.toml [deploy] — these CI recipes are registry-mode only (see README)"; exit 1; }
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.arch }}
        run: bootcher --manifest bootcher.ci.toml build --target "${{ matrix.arch }}"
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image member to the registry
        # Push the just-built member under a scratch tag ($IMAGE:ci-<arch>) that `deploy`
        # pulls — the handoff goes through the registry, not a run artifact (see
        # ../../github-actions/deploy.yml). Channel-agnostic: this scratch tag is unrelated
        # to the :latest/:stable channel tags. Unsigned; only the channel tag is signed.
        run: |
          set -eu
          img="$(podman images --format '{{.Repository}}:{{.Tag}}' | grep ":latest-${{ matrix.arch }}\$" | head -n1)"
          test -n "$img" || { echo "no built image tagged :latest-${{ matrix.arch }}"; exit 1; }
          scratch="$IMAGE:ci-${{ matrix.arch }}"
          podman tag "$img" "$scratch"
          podman push "$scratch"

  # --- deploy: assemble the members and push to THIS RUN's channel ------------------
  # Same as the base recipe, except it publishes to the channel `changes` resolved: the
  # refreshed channel on a schedule, `stable` for a tag ref, otherwise empty — then we
  # omit the flag entirely, so bootcher uses its built-in `latest` default (and never has
  # to be told a channel for the common case).
  deploy:
    needs: [changes, build] # build waits for every matrix arch; changes has the channel
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.ref }} # same source build built
          fetch-tags: true
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image ref
        # Same derivation as the build jobs. IMAGE is the scratch-tag base; NAME the local
        # member basename `deploy --skip-build` retags to.
        run: |
          set -eu
          image="$(bootcher --manifest bootcher.ci.toml info --format '{{ .Image }}')"
          test -n "$image" || { echo "no registry in bootcher.toml [deploy] — these CI recipes are registry-mode only (see README)"; exit 1; }
          {
            echo "IMAGE=$image"
            echo "NAME=$(bootcher --manifest bootcher.ci.toml info --format '{{ .Name }}')"
          } >> "$GITHUB_ENV"
      # Pull each per-arch member `build` pushed under its scratch tag and retag it to the
      # local name `deploy --skip-build` expects — localhost/<name>:latest-<arch> — so the
      # list is assembled from them as before, just sourced from the registry, not a run
      # artifact. Keep this arch list in sync with the matrix.
      - name: Pull image members from the registry
        run: |
          set -eu
          for arch in x86_64 aarch64; do
            scratch="$IMAGE:ci-$arch"
            podman pull "$scratch"
            podman tag "$scratch" "localhost/$NAME:latest-$arch"
          done
      # Signing? Materialise the cosign key `[deploy] registry.key` points at:
      # - run: printf '%s' "$SIGN_KEY" > cosign.key
      #   env: { SIGN_KEY: "${{ secrets.SIGN_KEY }}" }
      - name: Deploy to channel
        # The members were pulled + retagged above; assemble + push under this run's
        # channel. `--channel` is added only for `stable`; otherwise CHANNEL is empty and
        # falls through to bootcher's `latest` default. `--skip-bootc-upgrade`
        # leaves the rollout to each device's auto-update timer (see ../../README.md).
        run: |
          set -eu
          if [ -n "${CHANNEL:-}" ]; then
            echo "deploying to channel: $CHANNEL"
            bootcher --manifest bootcher.ci.toml deploy --skip-build --skip-bootc-upgrade --channel "$CHANNEL"
          else
            echo "deploying to default channel: latest"
            bootcher --manifest bootcher.ci.toml deploy --skip-build --skip-bootc-upgrade
          fi
        env:
          CHANNEL: ${{ needs.changes.outputs.channel }} # stable, or empty → `latest`
          BOOTCHER_SIGN_PASSPHRASE: ${{ secrets.SIGN_PASSPHRASE }}

  # --- cleanup: prune old published image versions ----------------------------------
  # Identical to the base recipe's `cleanup` (see ../../github-actions/deploy.yml for the
  # full multi-arch-safety and token rationale). Channels need no special handling: the
  # protected-tag set comes from `bootcher info --format '{{ .Channels }}'`, which reports
  # every declared channel (`latest` + `stable`), so a live channel pointer is never pruned
  # by age. The CalVer tags it keeps N of are shared across channels, so one KEEP_PREVIOUS
  # covers both the latest and stable fleets.
  cleanup:
    needs: [deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # delete old package versions
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
    steps:
      - uses: actions/checkout@v4
      - name: Prune old image versions
        shell: python3 {0} # stdlib only (urllib/json) — the bootcher image bundles python3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # org-owned package refused? use a CLEANUP_TOKEN PAT
          DRY_RUN: "false" # "true" = log the plan without deleting (validate a first run)
        run: |
          # Identical to the base recipe's cleanup (see ../../github-actions/deploy.yml).
          # Channels need no special handling: `channels` comes from `bootcher info`, which
          # reports every declared channel, so a live channel pointer is a protected tag.
          import base64, json, os, subprocess, sys, urllib.error, urllib.request

          keep = int(os.environ.get("KEEP_PREVIOUS", "5"))
          dry_run = os.environ.get("DRY_RUN", "false") == "true"
          token = os.environ["GH_TOKEN"]
          owner = os.environ["GITHUB_REPOSITORY"].split("/")[0].lower()

          def project_info():
              argv = ["bootcher", "--manifest", "bootcher.ci.toml", "info", "--format", "json"]
              return json.loads(subprocess.run(argv, capture_output=True, text=True, check=True).stdout)

          info = project_info()
          name, channels = info["name"], set(info["channels"])
          print(f"cleanup: {owner}/{name} — keeping :latest + {keep} previous release(s) (dry-run={dry_run})")

          def fetch(url, headers, method="GET"):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method=method)) as r:
                  body = r.read()
              return json.loads(body) if body else None

          api = "https://api.github.com"
          gh_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          gh = lambda url, method="GET": fetch(url, gh_headers, method)

          # The package-versions endpoint differs for a user vs an org owner — detect once.
          kind = "orgs" if gh(f"{api}/users/{owner}")["type"] == "Organization" else "users"
          base = f"{api}/{kind}/{owner}/packages/container/{name}"

          versions, page = [], 1
          while (batch := gh(f"{base}/versions?per_page=100&page={page}")):
              versions += batch
              page += 1
          print(f"cleanup: {len(versions)} version(s) currently published")
          if not versions:
              print("cleanup: nothing to do")
              sys.exit(0)

          tags = lambda v: v["metadata"]["container"]["tags"]
          # Protected = a channel pointer (latest + [deploy] channels) or a ci-<arch> scratch
          # tag; those are mutable and never pruned by age.
          protected = lambda v: any(t in channels or t.startswith("ci-") for t in tags(v))

          releases = sorted((v for v in versions if tags(v) and not protected(v)),
                            key=lambda v: v["created_at"], reverse=True)
          keep_lists = {v["name"] for v in versions if protected(v)} | {v["name"] for v in releases[:keep]}

          # Extend the keep-set with the arch children the kept lists reference (registry
          # pull token), so a multi-arch image we keep never loses a member.
          basic = base64.b64encode(f"{owner}:{token}".encode()).decode()
          reg = fetch(f"https://ghcr.io/token?service=ghcr.io&scope=repository:{owner}/{name}:pull",
                      {"Authorization": f"Basic {basic}"})["token"]
          accept = ",".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])
          children = set()
          for digest in keep_lists:
              manifest = fetch(f"https://ghcr.io/v2/{owner}/{name}/manifests/{digest}",
                               {"Authorization": f"Bearer {reg}", "Accept": accept})
              children |= {m["digest"] for m in manifest.get("manifests", [])}

          keep_all = keep_lists | children
          doomed = [v for v in versions if v["name"] not in keep_all]
          # Guard: never proceed if that would leave nothing — a bug upstream shouldn't wipe
          # the package.
          if not keep_all or len(doomed) >= len(versions):
              sys.exit(f"cleanup: refusing to delete all {len(versions)} version(s) (keep-set empty) — aborting")
          print(f"cleanup: keeping {len(versions) - len(doomed)} version(s), deleting {len(doomed)}")

          for v in doomed:
              label = f"{v['name']} tags=[{','.join(tags(v))}]"
              if dry_run:
                  print(f"  would delete: {v['id']} {label}")
                  continue
              try:
                  gh(f"{base}/versions/{v['id']}", method="DELETE")
              except urllib.error.HTTPError as e:
                  if e.code == 403:
                      sys.exit("cleanup: GITHUB_TOKEN refused (403) — for an org-owned package set a "
                               "CLEANUP_TOKEN PAT with delete:packages and use it as GH_TOKEN.")
                  raise
              print(f"  deleted: {v['id']} {label}")
          print("cleanup: done")
