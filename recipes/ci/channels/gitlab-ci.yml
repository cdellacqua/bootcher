# bootcher CI with RELEASE CHANNELS — GitLab CI, multi-arch (x86_64 + aarch64).
#
# A channels-aware variant of ../gitlab-ci.yml. The pipeline *shape* is identical —
# build (per-arch, native runners) → deploy (assemble + push) → provision (per-arch
# disks), the loopback container store in `before_script`, and the `.image-rules` path
# gate — so this header only covers what's DIFFERENT: which channel each trigger
# publishes to. For the store relocation, the per-arch split rationale, and the CI/CD
# variables, read ../gitlab-ci.yml and ../README.md; nothing there changes.
#
#   push to default branch      → deploy to the default `latest` channel (rolling / canary)
#   push a v* tag               → deploy to the `stable` channel         (production fleet)
#   schedule                    → refresh `latest`                       (base updates)
#   schedule, SCHEDULE_CHANNEL=<c> → refresh channel <c>                  (base updates)
#   manual run on branch/a tag  → rebuild it into `latest` / `stable`, unconditionally
#
# A refresh rebuilds the exact commit its channel currently ships — read from the
# `org.opencontainers.image.revision` label bootcher stamps on every image — on today's
# base. So it never ships unreleased source, and it works for any channel whatever feeds
# it (tags, a branch, a hand-pushed rollback). Base-image refreshes take one pipeline
# schedule per channel (Build → Pipeline schedules), all targeting the default branch,
# staggered so the canary fleet runs a new Fedora base for a few days before production
# gets it — e.g. `17 3 * * 6` (Saturday) plain for `latest`, and `17 3 * * 2` (Tuesday)
# with the variable SCHEDULE_CHANNEL=stable. `base-check` resolves the commit and
# `.build`/`deploy` check it out. Each scheduled pipeline skips the build when the base
# hasn't moved since its channel was last published. Needs git and skopeo in the
# bootcher image (bootcher v0.2.6+).
#
# THE MECHANISM (see ../../../docs/src/reference/bootcher-toml.md#channels). A channel
# is a mutable registry tag `<registry>/<name>:<channel>` that a SUBSET of devices
# tracks. `bootcher deploy --channel stable` pushes the multi-arch list under :stable
# instead of :latest, so only devices whose bootc origin is :stable pick it up. Every
# deploy ALSO stamps that same digest with its immutable :CalVer tag regardless of
# channel — so the version tag is the durable rollback/audit handle and the channel is
# just a moving pointer to "what that audience sees now".
#
# THE PROMOTION MODEL this encodes:
#   - Every push to the default branch publishes :latest. Devices provisioned on the
#     default channel (dev boxes / QA rigs) auto-update to it on their timer — the canary.
#   - When a commit has proven good, tag it `vX.Y.Z`. The tag pipeline rebuilds THAT
#     commit and publishes it to :stable; production devices (provisioned with `--channel
#     stable`) only now auto-update. The tag is on the same source commit, so stable is
#     that validated revision and `git describe` stamps `vX.Y.Z` as its version label.
#     (bootcher rebuilds on the tag rather than re-tagging the default branch's exact
#     digest — same source, fresh CalVer; the immutable CalVer tag is the per-build
#     identity either way. Need bit-identical promotion? Pull the branch's CalVer image
#     and `podman manifest push` it to :stable by hand instead of tagging.)
#
# bootcher.toml must DECLARE the channel so `--channel stable` validates — a typo'd
# channel is rejected, not silently minted as a stray tag:
#
#   [deploy]
#   registry = "registry.gitlab.com/<group>/<project>"   # == $CI_REGISTRY_IMAGE
#   channels = ["stable"]                                # beyond the implicit `latest`
#
#   [targets]
#   x86_64  = "qcow2"
#   aarch64 = "raw"
#
# ENROLLING a device onto a channel is a one-time `provision`/`takeover` from your
# machine (channels are registry-mode only; there's no LAN equivalent):
#   bootcher provision --ssh-key admin_key --channel stable   # → follows :stable
#   bootcher provision --ssh-key admin_key                    # → follows :latest
# The `provision` jobs below bake whichever channel matches the trigger, so a tag
# pipeline yields stable-tracking disks and a branch pipeline latest-tracking ones.
#
# CI/CD variables, Secure Files (signing), and the `bootcher.ci.toml` override are
# unchanged — see ../README.md.

default:
  image:
    name: ghcr.io/cdellacqua/bootcher:latest
    entrypoint: [""]
  before_script:
    # Real-fs container store (loopback ext4 so podman does one kernel overlay instead
    # of fuse-overlayfs-on-overlay). Self-skips on a real fs. Full rationale: the header
    # of ../gitlab-ci.yml.
    - |
      set -eu
      if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
        : "${BOOTCHER_STORE_SIZE:=20G}"
        img=/bootcher-store.img
        truncate -s "$BOOTCHER_STORE_SIZE" "$img"
        mkfs.ext4 -q -F "$img"
        mkdir -p /var/lib/containers/storage
        mount -o loop "$img" /var/lib/containers/storage
        echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
      else
        echo "container store already on a real fs; skipping loopback store"
      fi
      podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'

# No image ref to configure: the build/deploy jobs derive it from bootcher.toml at runtime
# with `bootcher info --format '{{ .Image }}'` (see ../gitlab-ci.yml). Channel-agnostic:
# the scratch tag it builds is a CI-internal handoff, unrelated to the :latest/:stable
# channel tags `deploy` publishes.

stages: [build, deploy, provision]

# --- when to run: only when something that affects the image changed --------------
# Identical to the base recipe: an allowlist of image inputs on the default-branch
# rule, and a tag rule with no `changes:` (a `v*` tag always builds). Tune the list to
# your project.
.image-rules:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - Containerfile
          - sysroot/**/*
          - bootcher.toml
          - bootcher.ci.toml
          - .gitlab-ci.yml

# --- base-check: did the base image move since the last publish? (schedules only) --
# A scheduled pipeline (see the header) exists to pick up base-image updates, so it's
# pointless — and costs every device a download and reboot — when the base hasn't moved.
# buildah stamps every built image with the base it came FROM
# (`org.opencontainers.image.base.name` — ARGs already resolved — and `.base.digest`,
# the per-arch manifest digest), and those annotations survive into the published
# members. So for each published arch, compare that digest with the base tag's current
# one for the same arch. Any difference — or anything that can't be checked (first run, an
# image built before this check, a registry hiccup) — rebuilds, so a failure here never
# costs a security update. The verdict travels to `.build` and `deploy` as BASE_CHANGED
# (a dotenv report); with `false` they exit early, green. A pipeline you run by hand isn't
# a schedule, so it always rebuilds: use it for package updates your Containerfile layers
# on top, which are otherwise only picked up when the base itself moves. A private base
# image needs its own `skopeo login`.
#
# Channels: a schedule with SCHEDULE_CHANNEL=<c> (see the header) compares against :<c>
# instead of :latest. It also picks the commit to rebuild — the
# `org.opencontainers.image.revision` label of the image the channel currently ships —
# and hands it to `.build`/`deploy` as SOURCE_REV, alongside BASE_CHANGED. With no usable
# label (an image built before bootcher v0.2.6 shipped git, or deployed from a dirty
# tree), `latest` falls back to the default branch; any other channel fails the pipeline
# rather than guess what to ship — publish it once the normal way (or with a manual run)
# and the next refresh has a label to follow.
base-check:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  needs: []
  before_script: [] # no container store needed: this job only reads registries
  script:
    - IMAGE="$(bootcher --manifest bootcher.ci.toml info --format '{{ .Image }}')"
    - test -n "$IMAGE" || { echo "no registry in bootcher.toml [deploy] — these CI recipes are registry-mode only (see README)"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | skopeo login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - |
      : > base.env
      rebuild() { echo "rebuilding: $*"; echo "BASE_CHANGED=true" >> base.env; exit 0; }
      CHANNEL="${SCHEDULE_CHANNEL:-latest}"
      if ! index="$(skopeo inspect --raw "docker://$IMAGE:$CHANNEL")"; then
        if [ "$CHANNEL" != latest ]; then
          echo "nothing published to $IMAGE:$CHANNEL yet: nothing to refresh"; echo "BASE_CHANGED=false" >> base.env; exit 0
        fi
        rebuild "no published $IMAGE:$CHANNEL to compare against"
      fi
      # The commit the channel ships (every arch member carries the same label).
      first="$(printf '%s' "$index" | jq -r 'first(.manifests[] | select(.platform.architecture != "unknown") | .digest)')"
      rev="$(skopeo inspect --config "docker://$IMAGE@$first" | jq -r '.config.Labels."org.opencontainers.image.revision" // empty')" || rev=''
      case "$rev" in
        ''|*-dirty)
          if [ "$CHANNEL" != latest ]; then
            echo "$IMAGE:$CHANNEL records no clean source revision ('$rev'), so there's no telling what to rebuild — publish it once with a normal deploy or a manual run"
            exit 1
          fi
          echo "$IMAGE:$CHANNEL records no clean source revision ('$rev'): refreshing from $CI_COMMIT_REF_NAME" ;;
        *)
          echo "$IMAGE:$CHANNEL ships $rev"
          echo "SOURCE_REV=$rev" >> base.env ;;
      esac
      for digest in $(printf '%s' "$index" | jq -r '.manifests[] | select(.platform.architecture != "unknown") | .digest'); do
        arch="$(printf '%s' "$index" | jq -r --arg d "$digest" '.manifests[] | select(.digest == $d) | .platform.architecture')"
        annotations="$(skopeo inspect --raw "docker://$IMAGE@$digest")" \
          || rebuild "$arch: can't read the published member"
        base="$(printf '%s' "$annotations" | jq -r '.annotations."org.opencontainers.image.base.name" // empty')"
        built="$(printf '%s' "$annotations" | jq -r '.annotations."org.opencontainers.image.base.digest" // empty')"
        { [ -n "$base" ] && [ -n "$built" ]; } || rebuild "$arch: the published image records no base"
        raw="$(skopeo inspect --raw "docker://$base")" || rebuild "$arch: can't inspect $base"
        current="$(printf '%s' "$raw" | jq -r --arg a "$arch" 'first(.manifests[]? | select(.platform.architecture == $a) | .digest) // empty')"
        [ -n "$current" ] || current="$(skopeo inspect --format '{{.Digest}}' "docker://$base")" \
          || rebuild "$arch: can't inspect $base"
        [ "$current" = "$built" ] || rebuild "$arch: $base moved ($built -> $current)"
        echo "$arch: $base unchanged ($built)"
      done
      echo "base image unchanged since the last publish: skipping the rebuild"
      echo "BASE_CHANGED=false" >> base.env
  artifacts:
    reports:
      dotenv: base.env

# --- source checkout: rebuild the commit a refreshed channel ships ---------------
# A refresh pipeline runs on the default branch; `base-check` hands over the commit the
# channel currently ships as SOURCE_REV, so `.build` and `deploy` check it out first. The
# tags pointing at it come along, so `git describe` stamps its release name as the
# version label, as on a tag pipeline.
.source-checkout:
  script:
    - |
      if [ -n "${SOURCE_REV:-}" ]; then
        git config --global --add safe.directory "$CI_PROJECT_DIR"
        git fetch -q --depth 1 "$CI_REPOSITORY_URL" "$SOURCE_REV"
        git checkout -q --detach FETCH_HEAD
        # `^{}` lines are annotated tags peeled to their commit; plain lines lightweight tags.
        for t in $(git ls-remote --tags "$CI_REPOSITORY_URL" | awk -v r="$SOURCE_REV" '$1 == r { sub("^refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' | sort -u); do
          git fetch -q --depth 1 "$CI_REPOSITORY_URL" "+refs/tags/$t:refs/tags/$t"
        done
        echo "checked out $(git describe --tags --always)"
      fi

# --- build: one container per arch, on a native-arch runner -----------------------
# Channel-agnostic: the per-arch member is the same whether deploy later publishes it to
# :latest or :stable (the channel is chosen only at push time, in `deploy`). As in the
# base recipe, the member is pushed to the Container Registry under a scratch tag
# (<image>:ci-<arch>) that `deploy` pulls — not a job artifact (GitLab.com caps those at
# 1 GB, which a non-trivial image blows past even zstd'd). See ../gitlab-ci.yml for why.
.build:
  stage: build
  rules: !reference [.image-rules, rules]
  # On a schedule, wait for base-check's verdict (absent otherwise, hence optional).
  needs:
    - job: base-check
      optional: true
  script:
    # A schedule whose base image hasn't moved (see `base-check`) has nothing to build.
    - if [ "${BASE_CHANGED:-true}" = false ]; then echo "base image unchanged, nothing to build"; exit 0; fi
    - !reference [.source-checkout, script]
    # Derive the image ref from bootcher.toml (see ../gitlab-ci.yml): IMAGE is the base for
    # the :ci-<arch> scratch tag. Empty ⇒ LAN mode; registry-mode only, so fail fast.
    - IMAGE="$(bootcher --manifest bootcher.ci.toml info --format '{{ .Image }}')"
    - test -n "$IMAGE" || { echo "no registry in bootcher.toml [deploy] — these CI recipes are registry-mode only (see README)"; exit 1; }
    - bootcher --manifest bootcher.ci.toml build --target "$ARCH"
    # Log in with the job token and push the just-built member under a scratch tag
    # ($IMAGE:ci-<arch>) that `deploy` pulls. The scratch tag shares layers with the
    # :latest/:stable list deploy later publishes, so it costs ~no extra storage and is
    # overwritten each run. Unsigned — a CI-internal intermediate; only the channel tag is
    # signed (in deploy). See ../gitlab-ci.yml for the full rationale.
    - echo "$CI_REGISTRY_PASSWORD" | podman login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - |
      img="$(podman images --format '{{.Repository}}:{{.Tag}}' | grep ":latest-${ARCH}\$" | head -n1)"
      test -n "$img" || { echo "no built image tagged :latest-${ARCH}"; exit 1; }
      scratch="$IMAGE:ci-${ARCH}"
      podman tag "$img" "$scratch"
      podman push "$scratch"
      echo "member pushed: $scratch"

build:x86_64:
  extends: .build
  variables:
    ARCH: x86_64

build:aarch64:
  extends: .build
  variables:
    ARCH: aarch64
  tags: [saas-linux-small-arm64]

# --- deploy: assemble the members and push to THIS PIPELINE's channel -------------
# Same as the base recipe, except the channel is chosen by the trigger: a refresh
# publishes to the channel it refreshes (SCHEDULE_CHANNEL), a `v*` tag to `stable`,
# anything else (a default-branch push or plain schedule) to the default `latest`. We add
# `--channel <c>` then and omit the flag otherwise — letting bootcher use its built-in
# `latest` default.
deploy:
  stage: deploy
  # artifacts: false — members travel through the Container Registry now (see `.build`).
  needs:
    - job: base-check # carries BASE_CHANGED on a schedule
      optional: true
    - job: "build:x86_64"
      artifacts: false
    - job: "build:aarch64"
      artifacts: false
  rules: !reference [.image-rules, rules]
  # Signing? Uncomment to set the cosign key passphrase (use "" if it has none):
  # variables:
  #   BOOTCHER_SIGN_PASSPHRASE: ""
  script:
    # Nothing was built (see `base-check`), so there's nothing to publish.
    - if [ "${BASE_CHANGED:-true}" = false ]; then echo "base image unchanged, nothing to deploy"; exit 0; fi
    - !reference [.source-checkout, script]
    # Derive the refs from bootcher.toml (see ../gitlab-ci.yml). IMAGE is the scratch-tag
    # base; NAME the local member basename `deploy --skip-build` retags to.
    - IMAGE="$(bootcher --manifest bootcher.ci.toml info --format '{{ .Image }}')"
    - NAME="$(bootcher --manifest bootcher.ci.toml info --format '{{ .Name }}')"
    - test -n "$IMAGE" || { echo "no registry in bootcher.toml [deploy] — these CI recipes are registry-mode only (see README)"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | podman login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    # Pull each per-arch member `build` pushed under its scratch tag and retag it to the
    # local name `deploy --skip-build` expects (localhost/<name>:latest-<arch>). Keep this
    # arch list in sync with the build jobs.
    - |
      for arch in x86_64 aarch64; do
        scratch="$IMAGE:ci-${arch}"
        podman pull "$scratch"
        podman tag "$scratch" "localhost/${NAME}:latest-${arch}"
      done
    # Signing? Fetch the cosign key from Secure Files first (see ../gitlab-ci.yml).
    # `--channel <c>` on a refresh of <c> or (stable) a tag pipeline; otherwise no flag →
    # bootcher's `latest`. `--skip-bootc-upgrade` leaves the rollout to each device's
    # auto-update timer. Map your own channels to triggers here.
    - |
      if [ "$CI_PIPELINE_SOURCE" = schedule ]; then CHANNEL="${SCHEDULE_CHANNEL:-}"
      elif [ -n "${CI_COMMIT_TAG:-}" ]; then CHANNEL=stable
      else CHANNEL=; fi
      if [ "$CHANNEL" = latest ]; then CHANNEL=; fi
      if [ -n "$CHANNEL" ]; then
        echo "deploying to channel: $CHANNEL"
        bootcher --manifest bootcher.ci.toml deploy --skip-build --skip-bootc-upgrade --channel "$CHANNEL"
      else
        echo "deploying to default channel: latest"
        bootcher --manifest bootcher.ci.toml deploy --skip-build --skip-bootc-upgrade
      fi

# --- provision: build a flashable disk that TRACKS this pipeline's channel --------
# Same as the base recipe, but it's playable on tag pipelines too, and it bakes the
# matching channel into the disk: a `v*`-tag run yields a disk whose bootc origin is
# :stable (a production device), a default-branch run a :latest disk (a canary device).
# `provision --channel` sets the device origin, so the flashed device follows that
# channel from first boot. The Package Registry path is namespaced by channel so the
# stable and latest disks for a commit don't overwrite each other.
.provision:
  stage: provision
  # `needs: []` fully decouples provision, matching the GitHub recipe
  # (channels/github-actions/provision.yml). The empty array is load-bearing: with no
  # `needs` at all, GitLab falls back to stage ordering and the manual job would wait on
  # every prior stage; `[]` lets you play it standalone without running them.
  # `--skip-build --channel <c>` pulls whatever the chosen channel tag currently points
  # at — so it always provisions from the last image deploy published to that channel.
  # Play it after the build→deploy for the commit you want has finished.
  needs: []
  rules:
    # Manual on BOTH a tag and the default branch (the base recipe is default-branch
    # only). `when: manual` must live inside the rule, and `allow_failure: true` keeps
    # this optional job from blocking the pipeline — play it from the UI for a disk.
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    PKG_NAME: disk
  script:
    - echo "$CI_REGISTRY_PASSWORD" | podman login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - printf '%s\n' "$ADMIN_SSH_PUBKEY" > admin_key.pub
    # The channel this disk will track, mirroring the deploy: tag → stable, branch → latest.
    # `--channel` sets the disk's bootc origin and `--skip-build` pulls that arch's member
    # out of the SAME channel tag deploy pushed. `latest` is always valid without being
    # declared; `stable` must be in `[deploy] channels`. Public registry? Append `--anonymous`.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then CHANNEL=stable; else CHANNEL=latest; fi
      echo "provisioning a disk that tracks the '$CHANNEL' channel"
      bootcher --manifest bootcher.ci.toml provision --ssh-key admin_key --target "$ARCH" --disk "$DISK" --skip-build --channel "$CHANNEL"
    # Publish output/ to the generic Package Registry, versioned by channel + commit + arch
    # so stable and latest disks never collide. See ../gitlab-ci.yml for the packaging: one
    # store-mode .zip of the zstd-compressed disk, uploaded from a file so curl can --retry.
    - |
      if (set -o pipefail) 2>/dev/null; then set -o pipefail; fi
      if [ -n "${CI_COMMIT_TAG:-}" ]; then CHANNEL=stable; else CHANNEL=latest; fi
      file="bootcher-output-${CHANNEL}-${ARCH}.zip"
      url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PKG_NAME/$CHANNEL-$CI_COMMIT_SHORT_SHA/$file"
      find output -type f -name 'disk.*' ! -name '*.tar.*' -exec zstd -10 -T0 -q --rm {} +
      zip -0 -q -r "$file" output
      curl --fail-with-body --retry 3 \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "$file" "$url"
      echo
      echo "disk published: $url — tracks the '$CHANNEL' channel"
      echo "download + unpack with: curl --header \"PRIVATE-TOKEN: <token>\" \"$url\" -o out.zip && unzip out.zip"

provision:x86_64:
  extends: .provision
  variables:
    ARCH: x86_64
    DISK: qcow2

provision:aarch64:
  extends: .provision
  variables:
    ARCH: aarch64
    DISK: raw
  tags: [saas-linux-small-arm64]
