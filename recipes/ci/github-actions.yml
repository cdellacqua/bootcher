# bootcher CI for GitHub Actions.
#
# Copy this to your bootcher project as `.github/workflows/bootcher.yml`.
#
# Both jobs run inside the published bootcher image
# (ghcr.io/cdellacqua/bootcher — multi-arch, bundles podman + qemu), so there's
# nothing to install. It needs a privileged container for podman to build images;
# GitHub-hosted runners allow that. Pin `:latest` to a released `:vX.Y.Z` for
# reproducible builds.
#
# Because each job runs bootcher *inside* a container, the job's root fs is
# overlayfs, so rootful `podman build`'s store would fall back to fuse-overlayfs
# (the kernel refuses overlay-on-overlay), whose userspace coherence breaks a
# large `dnf install` — rpm "loses" base-provided sonames mid-transaction. The
# first step of each job sidesteps it by relocating the podman store onto a
# loopback ext4 image: a real fs, so podman does a single kernel overlay (no fuse,
# and only deltas — unlike STORAGE_DRIVER=vfs, which ENOSPCs on a chromium build).
# It self-skips on a non-overlay store, and needs the privileged container (loop
# mount). Tune the ceiling with the BOOTCHER_STORE_SIZE env var (`df -h` on the
# runner). GitHub workflow YAML has no anchors, so the step is duplicated per job.
#
# Two jobs, one trigger (push):
#   deploy    — on push to the default branch and on `v*` tags: `bootcher deploy`
#               builds the container and pushes `<registry>/<name>:latest` to GHCR
#               (the registry associated with this repo). Devices self-update.
#   provision — chained behind deploy (`needs: [deploy]`) on default-branch pushes:
#               `bootcher provision --skip-build` reuses the image deploy just pushed
#               (pulled back from GHCR), builds the disk image from it, and uploads
#               `output/` as a downloadable artifact for you to flash/upload. No
#               second container build, and — because it's in the same run as deploy —
#               the disk is byte-for-byte *this push's* image, never a stale `:latest`.
#               It's on-demand via a manual approval gate (a GitHub Environment with a
#               required reviewer), not a separate "Run workflow", so it can depend on
#               deploy. See the `provision:` job for the one-time Environment setup.
#
# bootcher.toml must point its registry at this repo's GHCR namespace:
#
#   [deploy]
#   registry = "ghcr.io/<owner>"        # lowercase; image is ghcr.io/<owner>/<name>
#
# Both jobs run with `--manifest bootcher.ci.toml` — a committed override that
# `extend`s bootcher.toml and forces podman onto the host network, sidestepping
# nested-podman nftables failures in the privileged CI container. Copy
# recipes/ci/bootcher.ci.toml to your project root beside bootcher.toml.
#
# Repository secrets & variables (Settings → Secrets and variables → Actions):
#   ADMIN_SSH_PUBKEY (provision) the admin SSH PUBLIC key (the `.pub` line) baked into
#                    the disk as the `admin` login. Not secret — provision reads only
#                    the public half, so add it under the *Variables* tab, not Secrets.
#                    Generate the pair with `ssh-keygen -t ed25519` and keep the
#                    private key wherever you SSH to devices from.
#   PULL_USER /      (provision, registry mode) a LONG-LIVED read-only registry
#   PULL_TOKEN       credential baked into the disk so the device can pull updates.
#                    Use a personal access token with `read:packages` — NOT the
#                    ephemeral GITHUB_TOKEN, which dies with the run. For a public
#                    package, drop these and add `--anonymous` to the provision step.
#   SIGN_KEY /       (optional) cosign private key + its passphrase — only if you
#   SIGN_PASSPHRASE  enabled image signing (`bootcher sign enroll`).

name: bootcher

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # Push an update to the registry. Container build + `podman push`.
  deploy:
    runs-on: ubuntu-24.04 # build aarch64? use ubuntu-24.04-arm — same image tag
    permissions:
      contents: read
      packages: write # push to GHCR
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged # podman builds the container image (nested)
    steps:
      - uses: actions/checkout@v4
      # Real-fs container store (see the header note): a loopback ext4 so podman
      # does one kernel overlay instead of fuse-overlayfs-on-overlay. Self-skips
      # when the store is already on a real fs.
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          # Breadcrumb: expect `overlay` (kernel); a regression to fuse-overlayfs
          # means the store slipped back onto overlay-on-overlay (rpmdb bug returns).
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signing? Materialise the cosign key `[deploy] registry.key` points at:
      # - run: printf '%s' "$SIGN_KEY" > cosign.key
      #   env: { SIGN_KEY: "${{ secrets.SIGN_KEY }}" }
      - name: Deploy
        # Registry mode: push the image and stop. Skipping the per-device `bootc
        # upgrade` keeps the admin SSH key out of CI and doesn't assume the runner
        # can reach the fleet — devices pick the update up on their auto-update
        # timer. Drop the flag (and add the key) to roll immediately, or run
        # `bootcher deploy` from a host on the devices' network.
        run: bootcher --manifest bootcher.ci.toml deploy --skip-bootc-upgrade
        env:
          BOOTCHER_SIGN_PASSPHRASE: ${{ secrets.SIGN_PASSPHRASE }}

  # Build a disk image to flash, reusing the image `deploy` just pushed rather than
  # rebuilding it: `--skip-build` pulls `<registry>/<name>:latest` back from GHCR and
  # the image-builder disk step (a nested privileged container) builds the disk from
  # it.
  #
  # `needs: [deploy]` chains it behind deploy *in the same run*, so it always builds
  # from this push's fresh image, never a stale `:latest`. It's still on-demand: the
  # `environment:` below is the manual gate — GitHub holds the job "Waiting" until you
  # approve it in the run (no `workflow_dispatch`/"Run workflow" button needed). One
  # consequence: every default-branch push leaves a pending provision approval; just
  # approve it when you actually need a disk, or let it expire. Restricted to the
  # default branch (not `v*` tags), mirroring the GitLab recipe.
  #
  # SETUP (once): Settings → Environments → New environment `provision` → enable
  # "Required reviewers" and add yourself. Without a protection rule the job wouldn't
  # pause — it would provision on every push.
  provision:
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    environment: provision # required-reviewer protection = the manual approval gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # pull the deploy-built image back from GHCR for --skip-build
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # Real-fs container store (see the header note): a loopback ext4 so podman
      # does one kernel overlay instead of fuse-overlayfs-on-overlay. Self-skips
      # when the store is already on a real fs.
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          # Breadcrumb: expect `overlay` (kernel); a regression to fuse-overlayfs
          # means the store slipped back onto overlay-on-overlay (rpmdb bug returns).
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      # The image-builder disk step shells out to `sudo`, which the base image
      # doesn't ship — install it (we're root, so no password is needed).
      - name: Install sudo
        run: dnf install -y --setopt=install_weak_deps=False sudo
      # `--skip-build` pulls the deploy-built image back from GHCR, so this job needs
      # read access to the package. The workflow GITHUB_TOKEN has it for a package in
      # this repo. Public package? Drop this login (the pull is anonymous) and add
      # `--anonymous` below.
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write admin public key
        # provision reads only the `.pub` sibling of `--ssh-key`, so the public key
        # is all CI needs — `admin_key` itself never has to exist. Keeping the private
        # key out of CI is safe: these jobs never SSH to a device.
        run: printf '%s\n' "$ADMIN_SSH_PUBKEY" > admin_key.pub
        env:
          ADMIN_SSH_PUBKEY: ${{ vars.ADMIN_SSH_PUBKEY }}
      - name: Provision (reuse deploy's image + build disk)
        # The disk bakes the admin pubkey and, in registry mode, the pull token so
        # the device can fetch updates. For a public registry, drop the PULL_* env
        # and append `--anonymous` instead. `--skip-build` reuses the image `deploy`
        # pushed (pulled back above) instead of rebuilding the container.
        run: bootcher --manifest bootcher.ci.toml provision --ssh-key admin_key --skip-build
        env:
          BOOTCHER_PULL_USER: ${{ secrets.PULL_USER }}
          BOOTCHER_PULL_TOKEN: ${{ secrets.PULL_TOKEN }}
      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: disk-image
          path: output/
          if-no-files-found: error
