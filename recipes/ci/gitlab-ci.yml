# bootcher CI for GitLab — multi-arch (x86_64 + aarch64).
#
# Copy this to your bootcher project as `.gitlab-ci.yml` at the repo root. It builds
# both architectures on native runners (no cross-arch emulation), assembles them into
# one multi-arch image, and can produce a flashable disk per arch — in three stages:
#
#   build      — one job per arch (build:x86_64, build:aarch64), in parallel, each on a
#                native-arch runner. `bootcher build --target <arch>` builds just that
#                arch's container and stops at the per-arch member tag
#                localhost/<name>:latest-<arch> (NO multi-arch list — `deploy` makes
#                that). The job `podman save`s the member as a compressed job artifact.
#                These jobs need NO registry credentials.
#   deploy     — one job. It `podman load`s both per-arch members the build jobs
#                produced, then `bootcher deploy --skip-build` (re)assembles the
#                multi-arch manifest list from them and pushes <registry>/<name>:latest
#                (+ an immutable CalVer tag) to this project's Container Registry. The
#                ONLY job that needs registry push credentials (and the signing key, if
#                enabled). Devices self-update.
#   provision  — manual, one job per arch (provision:x86_64 → qcow2,
#                provision:aarch64 → raw), each on a native-arch runner. `bootcher
#                provision --target <arch> --disk <type> --skip-build` pulls that arch's
#                member back from the registry `deploy` just pushed and builds the disk
#                natively, then streams output/ to the generic Package Registry to
#                download and flash. No second container build; the disk is
#                byte-for-byte what devices auto-update to.
#
# The pipeline is path-gated (see `.image-rules`): build/deploy run only when an image
# input changed (Containerfile, sysroot/, the manifests), so a docs-only push is a
# no-op; a `v*` tag always builds. Tune the allowlist there to your project.
#
# Why split the build per arch? A multi-arch `bootcher deploy` on a single runner would
# build the foreign arch under qemu-user emulation — slow and occasionally fragile.
# Building each arch on its own native runner is faster and more reliable. The members
# are handed between jobs as artifacts: the CI owns the `podman save`/`load`, so
# bootcher's own `build`/`deploy` on a dev box are untouched.
#
# bootcher.toml must (1) point its registry at this project's registry and (2) list
# BOTH arches in [targets], mapped to the disk type each should produce:
#
#   [deploy]
#   registry = "registry.gitlab.com/<group>/<project>"   # == $CI_REGISTRY_IMAGE
#
#   [targets]
#   x86_64  = "qcow2"   # a VM image
#   aarch64 = "raw"     # a raw image for an edge device
#
# Every job runs with `--manifest bootcher.ci.toml` — a committed override that
# `extend`s bootcher.toml and forces podman onto the host network, sidestepping
# nested-podman nftables failures in the privileged job container. Copy
# recipes/ci/bootcher.ci.toml to your repo root beside bootcher.toml.
#
# Runners: the aarch64 jobs need an arm64 runner — on GitLab.com a hosted
# `saas-linux-*-arm64` (tagged below; the small size is on all tiers). All these jobs
# need a PRIVILEGED job container (podman builds containers and loop-mounts the store,
# and the image-builder disk step launches a privileged container); GitLab.com's hosted
# `saas-linux-*` runners already are, so this works as-is. A self-managed runner needs
# `privileged = true` (or a shell runner on a podman host).
#
# CI/CD variables (Settings → CI/CD → Variables; mask them):
#   ADMIN_SSH_PUBKEY         (provision) the admin SSH PUBLIC key (the `.pub` line),
#                            baked into the disk as the `admin` login. Not secret — a
#                            plain (unmasked) variable is fine. Keep the matching
#                            private key wherever you SSH to devices from.
#   BOOTCHER_PULL_USER /     (provision, registry mode) a LONG-LIVED read-only
#   BOOTCHER_PULL_TOKEN      credential baked into the disk so the device can pull
#                            updates. Create a Deploy Token with `read_registry`
#                            scope under Settings -> Repository -> Deploy tokens
#                            (NOT Settings -> Access tokens, which gives no
#                            username). Copy BOTH one-time fields: the username
#                            (gitlab+deploy-token-..., or a custom name) ->
#                            BOOTCHER_PULL_USER, the secret -> BOOTCHER_PULL_TOKEN.
#                            NOT $CI_JOB_TOKEN, which expires with the pipeline.
#                            bootcher reads these env vars directly. Public
#                            registry? Drop them and add `--anonymous` below.
#   BOOTCHER_SIGN_PASSPHRASE (optional) the cosign key passphrase, if you enabled
#                            signing and your key has one. Set it even when empty (to
#                            "") so cosign doesn't prompt on the non-interactive runner.
# Secure Files (Settings → CI/CD → Secure Files), only if you enabled signing:
#   cosign.key               the cosign PRIVATE key `[deploy] registry.key` points at.
#                            A Secure File, not a CI variable, because a PEM is
#                            multi-line and so can't be a *masked* variable. The deploy
#                            job fetches it before signing the push (see below).
#                            Note: Secure Files can't be scoped to protected branches
#                            the way a Protected variable can — protect your default
#                            branch and keep deploy default-branch-only (it is) so only
#                            trusted pipelines can fetch the key.

default:
  # The published bootcher image (multi-arch, bundles podman + qemu). Pin `:latest`
  # to a released `:vX.Y.Z` for reproducible builds.
  image:
    name: ghcr.io/cdellacqua/bootcher:latest
    entrypoint: [""] # the image's entrypoint is bootcher itself; we drive it from sh
  before_script:
    # --- real-fs container store (nested-overlay workaround) -------------------
    # GitLab's hosted saas runners run each job inside a container whose root fs is
    # itself overlayfs. Rootful `podman build`'s overlay store then can't use the
    # kernel overlay driver (the kernel refuses overlay-on-overlay) and falls back
    # to fuse-overlayfs, whose userspace copy-up/mmap coherence breaks a large
    # `dnf install`: rpm re-reads the rpmdb mid-transaction and "loses" base-provided
    # sonames (`libssl.so.3 is needed by ...`) even though they're present. Small
    # installs don't trip it; a chromium-scale one does.
    #
    # Fix: put the store on a REAL filesystem. A loopback-mounted ext4 image is a
    # genuine block fs no matter where its backing file lives, so podman does a
    # single, un-nested *kernel* overlay — no fuse, correct coherence. Unlike
    # STORAGE_DRIVER=vfs (a full copy per layer → ENOSPC on a chromium build),
    # ext4+overlay stores only deltas, so it fits the same disk. Needs the
    # privileged job container (loop mount); the runner VM is ephemeral, so there's
    # nothing to tear down. It also gives the deploy/provision jobs headroom to hold
    # the loaded/pulled per-arch members.
    #
    # Self-managed shell/host runner whose store is already on a real fs? The guard
    # detects the non-overlay case and skips itself, so this is safe to leave in.
    - |
      set -eu
      if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
        # Ceiling, not a reservation: the sparse image grows to the build's actual
        # delta size, capped by the runner's free disk. Tune to `df -h` — smaller
        # on saas-linux-small, larger if you have the room.
        : "${BOOTCHER_STORE_SIZE:=20G}"
        img=/bootcher-store.img
        truncate -s "$BOOTCHER_STORE_SIZE" "$img"
        mkfs.ext4 -q -F "$img"
        mkdir -p /var/lib/containers/storage
        mount -o loop "$img" /var/lib/containers/storage
        echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
      else
        echo "container store already on a real fs; skipping loopback store"
      fi
      # Breadcrumb: log the store driver. Expect `overlay` (kernel); a regression
      # to `fuse-overlayfs` means the store slipped back onto overlay-on-overlay
      # and the rpmdb coherence bug is back.
      podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'

stages: [build, deploy, provision]

# --- when to run: only when something that affects the image changed --------------
# The build context is the whole project root, so this is an ALLOWLIST of the inputs
# that actually change the built image: the Containerfile, the sysroot/ overlay baked
# into it, and the manifests (a registry/target/hook change there re-images too). A
# docs/README-only push no longer spins up the whole multi-arch build → deploy.
#
# Shared by `.build` and `deploy` via `!reference` so they gate identically — if they
# diverged, deploy could be scheduled with no build artifacts to assemble. provision
# inherits the gate transitively: it `needs: [deploy]`, so when deploy is filtered out
# provision drops with it (a manual disk build has nothing to pull anyway).
#
# Tags are deliberate releases: the tag rule has no `changes:`, so a `v*` tag always
# builds even if its commit touched none of these paths.
#
# Adjust the list to YOUR project: if the Containerfile `COPY`s other paths, or a
# [hooks] script lives outside sysroot/, add them — anything in the build context that
# ends up in the image belongs here. `.gitlab-ci.yml` is included so a pipeline edit
# re-runs itself.
.image-rules:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - Containerfile
          - sysroot/**/*
          - bootcher.toml
          - bootcher.ci.toml
          - .gitlab-ci.yml

# --- build: one container per arch, on a native-arch runner -----------------------
# `build --target <arch>` builds only that arch and stops at the per-arch member tag
# localhost/<name>:latest-<arch> (no multi-arch list — `deploy` assembles that). The
# member is saved as a compressed job artifact `deploy` loads. No registry credentials
# needed here — only `deploy` pushes.
.build:
  stage: build
  # Gate on image-affecting changes (see `.image-rules` above); tags always build.
  rules: !reference [.image-rules, rules]
  script:
    - bootcher --manifest bootcher.ci.toml build --target "$ARCH"
    # The build just produced exactly one image tagged `:latest-<arch>`. Save it; the
    # repo:tag is restored on `podman load`, so `deploy` finds the member by name. zstd
    # keeps the artifact small.
    - |
      img="$(podman images --format '{{.Repository}}:{{.Tag}}' | grep ":latest-${ARCH}\$" | head -n1)"
      test -n "$img" || { echo "no built image tagged :latest-${ARCH}"; exit 1; }
      podman save "$img" | zstd -T0 -10 -q -o "image-${ARCH}.tar.zst"
  artifacts:
    # `deploy` pulls these via `needs:`. NOTE: GitLab.com caps job artifacts at 1 GB —
    # a heavy image (chromium-scale) may exceed that even zstd'd. If so, stream it to
    # the generic Package Registry instead (the same pattern the provision job uses for
    # disks, allowing 5 GB/file) and download it in `deploy`.
    paths: ["image-${ARCH}.tar.zst"]
    expire_in: 1 day

build:x86_64:
  extends: .build
  variables:
    ARCH: x86_64

build:aarch64:
  extends: .build
  variables:
    ARCH: aarch64
  # aarch64 builds on a native arm64 runner (this recipe avoids cross-arch emulation).
  # GitLab.com hosted arm64 runner; the small size is available on all tiers.
  tags: [saas-linux-small-arm64]

# --- deploy: assemble the multi-arch image from the members and push --------------
# Loads both per-arch members the build jobs saved, then `deploy --skip-build`
# (re)assembles the multi-arch manifest list from them and pushes
# <registry>/<name>:latest (+ a CalVer tag). No container build, no disk step — the
# only job that needs registry push credentials (and the signing key, if enabled).
deploy:
  stage: deploy
  # Pull in both build jobs' artifacts (the per-arch member tarballs) and gate on them.
  needs: ["build:x86_64", "build:aarch64"]
  # Same gate as the build jobs (see `.image-rules`) so deploy is scheduled exactly
  # when its members were built — never with nothing to assemble. Tags always deploy.
  rules: !reference [.image-rules, rules]
  # Signing? Uncomment to set the cosign key's passphrase (use "" if it has none);
  # the env var wins over cosign's TTY prompt even when empty, so the non-interactive
  # runner doesn't hang/fail.
  # variables:
  #   BOOTCHER_SIGN_PASSPHRASE: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | podman login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    # Load every per-arch member the build jobs produced (artifacts downloaded via
    # `needs:`), restoring each localhost/<name>:latest-<arch> tag into local storage.
    - for f in image-*.tar.zst; do zstd -dc "$f" | podman load; done
    # Signing? The cosign key `[deploy] registry.key` points at is git-ignored, so fetch
    # it from GitLab Secure Files (uploaded as cosign.key) before deploy signs the push.
    # The installer downloads every secure file into ./.secure_files/; copy the key to
    # where the manifest expects it (cosign.key), leaving the committed path unchanged
    # for local runs. The bootcher image bundles curl and which (the installer probes for
    # curl with `which curl`), so no dependency install is needed here.
    # - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    # - install -m 600 .secure_files/cosign.key cosign.key
    # `--skip-build` (re)assembles the multi-arch list from the loaded members and pushes
    # it — no container build. `--skip-bootc-upgrade` leaves the rollout to each device's
    # auto-update timer (keeps the admin SSH key out of CI and doesn't assume the runner
    # can reach the fleet). Drop the flag (and wire an SSH key) to roll immediately.
    - bootcher --manifest bootcher.ci.toml deploy --skip-build --skip-bootc-upgrade

# --- provision: build a flashable disk per arch, natively -------------------------
# Manual. `provision --target <arch> --disk <type> --skip-build` pulls that arch's
# member back from the registry `deploy` just pushed and builds the disk natively (no
# emulation), then streams output/ to the generic Package Registry to download + flash.
.provision:
  stage: provision
  # Chain behind deploy so the disk is built from *this* pipeline's freshly pushed
  # image, never a stale one: `--skip-build` pulls <registry>/<name>:latest, which must
  # exist first. `needs: ["deploy"]` makes the manual job playable only once deploy
  # succeeds. This also carries the image-change gate transitively: a push that didn't
  # touch an image input filters deploy out (see `.image-rules`), so provision drops
  # with it — there'd be no new image to pull anyway. Want a disk for an
  # already-published image? Replay this manual job from the pipeline that built it.
  needs: ["deploy"]
  rules:
    # Manual must live INSIDE the rule: a job-level `when: manual` is ignored once
    # `rules` is present (a matched rule with no `when` defaults to on_success), so it
    # would otherwise run automatically. `allow_failure: true` keeps this optional job
    # from blocking the pipeline — start it from the UI when you need a disk.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    # Generic Package Registry coordinates: versioned by commit so every provision is an
    # immutable, retrievable build. A bootc disk is a large sparse file that won't fit a
    # job artifact (GitLab.com caps those at 1 GB); tar+zstd crushes its unallocated
    # zeros, and the Package Registry allows 5 GB/file.
    PKG_NAME: disk
  script:
    # No dependency install: the bootcher image bundles everything these steps need —
    # sudo (image-builder disk step), tar + zstd (pack/compress the disk), curl (upload).
    # `--skip-build` pulls the deploy-pushed image back, so this job needs read access.
    # The job token is read+write on this project's registry and lives only for the
    # pipeline — fine for a pull. Public registry? Drop this login (the pull is
    # anonymous) and add `--anonymous` below.
    - echo "$CI_REGISTRY_PASSWORD" | podman login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    # provision reads only the `.pub` sibling of `--ssh-key`, so the public key is all CI
    # needs (`admin_key` itself never has to exist). Keeping the private key out of CI is
    # safe: these jobs never SSH to a device.
    - printf '%s\n' "$ADMIN_SSH_PUBKEY" > admin_key.pub
    # Build just this runner's arch + disk type. `--skip-build` pulls that arch's member
    # out of <registry>/<name>:latest (deploy pushed it) and builds the disk natively.
    # The disk bakes the admin pubkey and, in registry mode, the pull token
    # ($BOOTCHER_PULL_USER/$BOOTCHER_PULL_TOKEN, read from the environment). For a public
    # registry, append `--anonymous` instead.
    - bootcher --manifest bootcher.ci.toml provision --ssh-key admin_key --target "$ARCH" --disk "$DISK" --skip-build
    # Stream output/ straight to the generic Package Registry: tar+zstd into curl's stdin
    # so the compressed tarball never lands on the runner's disk — it was the extra
    # space-occupying file the disk couldn't spare. --sparse keeps the raw disk's
    # unallocated zeros from being read out; -T0 uses every core; -10 is a good
    # size/speed balance. JOB-TOKEN authenticates as this pipeline; the (chunked) PUT
    # both creates the package version and stores the streamed body, versioned by commit
    # and arch.
    #
    # Trade-offs of streaming vs. writing the file first:
    #   - No `--retry`: curl can't rewind a pipe, so a flaky upload fails the job — just
    #     re-run it. (Retrying would mean re-tarring the whole disk anyway.)
    #   - pipefail (enabled below when the shell supports it) makes a tar/zstd failure
    #     mid-pipe fail the job too, so a truncated stream can't be published as a
    #     "successful" upload. On a strict-POSIX sh without pipefail we fall through
    #     without it; --fail-with-body still catches a server-side rejection.
    #   - Needs the registry to accept a chunked PUT (no Content-Length); GitLab's
    #     generic registry does. If a future GitLab rejects it, fall back to writing the
    #     file and uploading with --upload-file "$file" --retry 3.
    - |
      if (set -o pipefail) 2>/dev/null; then set -o pipefail; fi
      file="bootcher-output-${ARCH}.tar.zst"
      url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PKG_NAME/$CI_COMMIT_SHORT_SHA/$file"
      tar --sparse -cf - output | zstd -10 -T0 -q | \
        curl --fail-with-body \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file - "$url"
      echo
      echo "disk published: $url"
      echo "download + unpack with: curl --header \"PRIVATE-TOKEN: <token>\" \"$url\" | zstd -d | tar -xf -"

provision:x86_64:
  extends: .provision
  variables:
    ARCH: x86_64
    DISK: qcow2

provision:aarch64:
  extends: .provision
  variables:
    ARCH: aarch64
    DISK: raw
  # Build the aarch64 raw disk on a native arm64 runner — no emulation.
  tags: [saas-linux-small-arm64]
