# bootcher CI — GitLab, multi-arch: releases, promotes, base-image refreshes, disks.
#
# Recipe docs: https://github.com/cdellacqua/bootcher/tree/main/recipes/ci
# Copy to `.gitlab-ci.yml` at your repo root, with `bootcher.ci.toml` and the `ci/`
# scripts beside it.
#
#   push a `v*` tag            → build (per arch, native runners) → publish the release
#                                → manual promote:<channel> jobs (one per channel)
#   run pipeline, RELEASE=v1.3 → manual promote jobs for that release (a rollback), and
#                                with REFRESH=true a rebuild of it on today's base first
#   schedule, SCHEDULE_CHANNEL → if that channel's base moved: rebuild the commit it
#                                serves → `channel refresh` (re-push + re-copy)
#   manual provision:<arch>    → a disk image following PROVISION_CHANNEL
#   branch push                → nothing (direct devices update from a workstation)
#
# THE HAND-OFF. Each build job pushes its member as `<image>:ci-<sha12>-<arch>`; the
# publish/refresh job pulls them back as `localhost/<name>:latest-<arch>`, which
# `--skip-build` takes (each must record the release's commit). Through the registry, not
# job artifacts: a full OS-image member exceeds GitLab.com's 1 GB artifact cap. Keep
# `ci-.*` tags for a day or two in the cleanup policy (see the recipe docs).
#
# A refresh builds the release's own commit under that commit's own `bootcher.ci.toml`
# (full clone, `GIT_DEPTH: 0`); publishing stays with the default branch's config.
#
# THE ARCHES come from `[targets]` (`bootcher info`): a build:<arch> or provision:<arch>
# job whose arch isn't a target is a no-op, so a single-arch project copies this
# unchanged (or deletes the job).
#
# SECRETS: protect your `v*` tags (Settings → Repository → Protected tags) and mark
# SIGN_KEY / SIGN_PASSPHRASE protected, so they reach publish and refresh and nothing
# else. If you restore files with GitLab's secure files, ignore `.secure_files/` in
# `.gitignore` — `release publish` refuses a dirty tree.

default:
  image:
    name: ghcr.io/cdellacqua/bootcher:latest
    entrypoint: [""] # the image's entrypoint is bootcher itself; we drive it from sh
  # Real-fs container store: a loopback ext4, so podman does one kernel overlay instead of
  # fuse-overlayfs on overlay. Self-skips on a real fs.
  before_script:
    - |
      set -eu
      if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
        : "${BOOTCHER_STORE_SIZE:=20G}"
        truncate -s "$BOOTCHER_STORE_SIZE" /bootcher-store.img
        mkfs.ext4 -q -F /bootcher-store.img
        mkdir -p /var/lib/containers/storage
        mount -o loop /bootcher-store.img /var/lib/containers/storage
      fi
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      echo "$CI_REGISTRY_PASSWORD" | podman login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      echo "$CI_REGISTRY_PASSWORD" | skopeo login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      b() { bootcher --manifest bootcher.ci.toml "$@"; }
      # Is $ARCH one of the `[targets]` arches?
      is_target() { b info --format '{{ json .Arches }}' | jq -e --arg a "$ARCH" 'index($a)' >/dev/null; }
      # Pull every member of SOURCE_REV back as the local `latest-<arch>` images.
      pull_members() {
        image="$(b info --format '{{ .Image }}')"; name="$(b info --format '{{ .Name }}')"
        for arch in $(b info --format '{{ json .Arches }}' | jq -r '.[]'); do
          scratch="$image:ci-$(printf %.12s "$SOURCE_REV")-$arch"
          podman pull "$scratch"
          podman tag "$scratch" "localhost/$name:latest-$arch"
        done
      }
      # With signing on, restore the private key from SIGN_KEY (a protected variable,
      # not a file one) to wherever `[registry] key` points: `signing rotate` repoints
      # it, and `*.key` is git-ignored. Signing off: a no-op.
      restore_key() {
        key="$(b info --format '{{ .Key }}')"
        [ -n "$key" ] || return 0
        [ -n "${SIGN_KEY:-}" ] || { echo "signing is on ([registry] key = $key) but SIGN_KEY is empty (protected variable on an unprotected ref?)"; return 1; }
        printf '%s' "$SIGN_KEY" > "$key"
      }

variables:
  PROVISION_CHANNEL: stable # the channel provision:<arch> disks follow

stages: [plan, build, publish, promote, provision]

# --- plan: what does this pipeline rebuild? ----------------------------------------
# Tag pipeline: the tag's commit. Schedule: the commit SCHEDULE_CHANNEL serves, only if
# its base moved (STALE). RELEASE + REFRESH=true: that release's commit.
plan:
  stage: plan
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_CHANNEL
    - if: $RELEASE && $REFRESH == "true"
  script:
    - |
      set -eu
      b() { bootcher --manifest bootcher.ci.toml "$@"; }
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        commit="$CI_COMMIT_SHA"; build=true
      elif [ -n "${SCHEDULE_CHANNEL:-}" ]; then
        b info --format '{{ json .Channels }}' | jq -e --arg c "$SCHEDULE_CHANNEL" 'index($c)' >/dev/null \
          || { echo "this schedule's SCHEDULE_CHANNEL '$SCHEDULE_CHANNEL' isn't in [registry] channels: $(b info --format '{{ .Channels }}') — fix the variable in CI/CD → Pipeline schedules"; exit 1; }
        set -- $(b channel status "$SCHEDULE_CHANNEL" --format '{{ .Stale }} {{ .Lags }} {{ .Commit }}')
        stale="$1"; lags="$2"; commit="${3:-}"
        echo ":$SCHEDULE_CHANNEL stale=$stale lags=$lags commit=$commit"
        if [ "$stale" = true ] && [ -n "$commit" ]; then build=true
        elif [ "$lags" = true ]; then build=none
        else build=false; fi
      else
        commit="$(b release list --format '{{ .Release }} {{ .Commit }}' | awk -v r="$RELEASE" '$1 == r { print $2 }')"
        test -n "$commit" || { echo "$RELEASE isn't published, or records no source commit"; exit 1; }
        build=true
      fi
      printf 'SOURCE_REV=%s\nBUILD=%s\n' "$commit" "$build" > plan.env
  artifacts:
    reports:
      dotenv: plan.env

# Is the pinned Fedora release still supported? From its end of life no channel is ever
# stale again. Warns at one release behind, fails at two; gates nothing.
release-check:
  stage: plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script: []
  variables:
    WARNING_PREFIX: "warning: "
    BEHIND_EXIT_CODE: "3"
  allow_failure:
    exit_codes: [3]
  script:
    - python3 ci/release_check.py

# --- build: one member per arch, on a native-arch runner, of SOURCE_REV ------------
.build:
  stage: build
  needs: [plan]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_CHANNEL
    - if: $RELEASE && $REFRESH == "true"
  variables:
    GIT_DEPTH: 0 # a refresh checks out an older commit
  script:
    - if [ "$BUILD" != true ]; then echo "nothing to build"; exit 0; fi
    - if ! is_target; then echo "$ARCH isn't in [targets] — nothing to build"; exit 0; fi
    - git checkout -q --detach "$SOURCE_REV"
    - b build --target "$ARCH"
    - scratch="$(b info --format '{{ .Image }}'):ci-$(printf %.12s "$SOURCE_REV")-$ARCH"
    - podman tag "localhost/$(b info --format '{{ .Name }}'):latest-$ARCH" "$scratch"
    - podman push "$scratch"

build:x86_64:
  extends: .build
  variables:
    ARCH: x86_64

build:aarch64:
  extends: .build
  variables:
    ARCH: aarch64
  tags: [saas-linux-small-arm64]

# --- publish: the tag is the release name ------------------------------------------
publish:
  stage: publish
  needs: [plan, "build:x86_64", "build:aarch64"]
  resource_group: bootcher-registry
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - pull_members
    - restore_key
    - BOOTCHER_SIGN_PASSPHRASE="${SIGN_PASSPHRASE:-}" b release publish "$CI_COMMIT_TAG" --skip-build --git-tag no

# --- refresh: a channel's base patch, or a release rebuilt for a rollback ----------
refresh:
  stage: publish
  needs: [plan, { job: "build:x86_64", optional: true }, { job: "build:aarch64", optional: true }]
  resource_group: bootcher-registry
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_CHANNEL
    - if: $RELEASE && $REFRESH == "true"
  script:
    - if [ "$BUILD" = false ]; then echo "base current, channel current — nothing to do"; exit 0; fi
    - if [ "$BUILD" = true ]; then pull_members; fi
    - restore_key
    - |
      export BOOTCHER_SIGN_PASSPHRASE="${SIGN_PASSPHRASE:-}"
      if [ -n "${SCHEDULE_CHANNEL:-}" ]; then
        b channel refresh "$SCHEDULE_CHANNEL" -y --skip-remotes --skip-build
      else
        b release refresh "$RELEASE" --skip-build
      fi

# --- promote: one manual job per channel ---------------------------------------------
# Promotes the tag of a tag pipeline, or RELEASE in a run-pipeline (a rollback). A
# protected environment per channel (Settings → CI/CD → Protected environments; a
# Premium feature) gates who may promote — without it, anyone who can run the pipeline
# can. Devices pick it up on their next auto-update (`--skip-remotes`: CI
# can't reach them).
.promote:
  stage: promote
  resource_group: bootcher-registry
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
    - if: $RELEASE
      when: manual
  # In a tag pipeline, wait for this pipeline's `publish` (a promote before the push
  # would find no `:X`, or the previous one); a run-pipeline (RELEASE) has none.
  needs: [{ job: publish, optional: true }]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | skopeo login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - bootcher --manifest bootcher.ci.toml channel promote -y --skip-remotes "${RELEASE:-$CI_COMMIT_TAG}" "$CHANNEL"

promote:next:
  extends: .promote
  variables:
    CHANNEL: next
  environment: next

promote:stable:
  extends: .promote
  variables:
    CHANNEL: stable
  environment: stable

# --- provision: a disk image per arch, following PROVISION_CHANNEL -----------------
# Built from exactly what the channel serves (pulled, never rebuilt), with the pull
# credential and (with signing on) the trust files baked in. Published as one `.zip`
# per arch (the disk zstd-compressed inside) to the generic Package Registry.
.provision:
  stage: provision
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: manual
      allow_failure: true
  script:
    - if ! is_target; then echo "$ARCH isn't in [targets] — nothing to provision"; exit 0; fi
    - printf '%s\n' "$ADMIN_SSH_PUBKEY" > admin_key.pub
    # A public registry? Add `--anonymous` (no pull credential is baked). Builds the
    # arch's `[targets]` disk types.
    - b device provision --channel "$PROVISION_CHANNEL" --ssh-key admin_key --target "$ARCH"
    - |
      release="$(b channel status "$PROVISION_CHANNEL" --format '{{ .Release }}')"
      file="bootcher-output-${ARCH}.zip"
      url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/disk/$PROVISION_CHANNEL-$release/$file"
      find output -type f -name 'disk.*' ! -name '*.tar.*' -exec zstd -10 -T0 -q --rm {} +
      zip -0 -q -r "$file" output
      curl --fail-with-body --retry 3 --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$url"
      echo
      echo "disk published: $url"

provision:x86_64:
  extends: .provision
  variables:
    ARCH: x86_64

provision:aarch64:
  extends: .provision
  variables:
    ARCH: aarch64
  tags: [saas-linux-small-arm64]
