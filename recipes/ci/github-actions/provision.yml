# bootcher CI — GitHub Actions PROVISION workflow: disk images for new channel devices.
#
# Recipe docs: https://github.com/cdellacqua/bootcher/tree/main/recipes/ci
# Copy to `.github/workflows/bootcher-provision.yml`.
#
# Actions → "bootcher provision" → Run workflow → pick the channel. One job per
# `[targets]` arch, on a native runner (RUNNERS), runs `bootcher device provision
# --channel <ch> --target <arch>`, building that arch's `[targets]` disk types: the
# disk is built from exactly what `:<ch>` serves (pulled by digest, never rebuilt), with
# the pull credential and (with signing on) the trust files baked in, and its origin set
# to the channel — so the device updates whenever that channel moves.
#
# The disk lands on a GitHub Release named after the channel and the release it serves
# (`disk-<channel>-<release>`), as one `.zip` per arch with the disk `zstd`-compressed
# inside: extract natively, then hand the `disk.*.zst` to rpi-imager / balenaEtcher.
# Creating that Release also creates a `disk-*` git tag, which release.yml ignores (it
# only fires on `v*`).

name: bootcher provision

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel the new devices follow
        required: true
        type: choice
        options: [stable, next] # keep in sync with `[registry] channels`

env:
  # A native runner per `[targets]` arch (see release.yml).
  RUNNERS: '{"x86_64": "ubuntu-24.04", "aarch64": "ubuntu-24.04-arm"}'

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
    outputs:
      matrix: ${{ steps.arches.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Map the target arches to runners
        id: arches
        run: |
          set -euo pipefail
          bootcher --manifest bootcher.ci.toml info --format '{{ json .Arches }}' \
            | jq -c --argjson r "$RUNNERS" \
                '{include: map({arch: ., runner: ($r[.] // error("no runner for \(.) in RUNNERS"))})}' \
            | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  provision:
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # create the Release + upload the disk as an asset
      packages: read # pull the channel's members
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            truncate -s "$BOOTCHER_STORE_SIZE" /bootcher-store.img
            mkfs.ext4 -q -F /bootcher-store.img
            mkdir -p /var/lib/containers/storage
            mount -o loop /bootcher-store.img /var/lib/containers/storage
          fi
      - name: Log in to GHCR
        run: |
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write admin public key
        run: printf '%s\n' "$ADMIN_SSH_PUBKEY" > admin_key.pub
        env:
          ADMIN_SSH_PUBKEY: ${{ vars.ADMIN_SSH_PUBKEY }}
      # A public registry? Drop the PULL_* env and add `--anonymous`: the device then
      # pulls anonymously and no credential is baked.
      - name: Provision ${{ matrix.arch }} on ${{ inputs.channel }}
        run: |
          bootcher --manifest bootcher.ci.toml device provision --channel "$CHANNEL" \
            --ssh-key admin_key --target "${{ matrix.arch }}"
        env:
          CHANNEL: ${{ inputs.channel }}
          BOOTCHER_PULL_USER: ${{ secrets.PULL_USER }}
          BOOTCHER_PULL_TOKEN: ${{ secrets.PULL_TOKEN }}
      - name: Publish the disk to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          release="$(bootcher --manifest bootcher.ci.toml channel status "$CHANNEL" --format '{{ .Release }}')"
          file="bootcher-output-${{ matrix.arch }}.zip"
          tag="disk-$CHANNEL-$release"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_TOKEN"
          find output -type f -name 'disk.*' ! -name '*.tar.*' -exec zstd -10 -T0 -q --rm {} +
          zip -0 -q -r "$file" output
          get_id() { curl -sf -H "$auth" "$api/releases/tags/$tag" 2>/dev/null | jq -r '.id // empty' || true; }
          id=$(get_id)
          if [ -z "$id" ]; then
            curl -sf -X POST -H "$auth" "$api/releases" \
              -d "$(jq -n --arg t "$tag" --arg c "$GITHUB_SHA" --arg ch "$CHANNEL" --arg r "$release" \
                    '{tag_name:$t, target_commitish:$c, name:$t, body:"bootcher disks following :\($ch) (serving \($r))"}')" \
              >/dev/null 2>&1 || true
            id=$(get_id)
          fi
          test -n "$id" || { echo "could not get or create release $tag"; exit 1; }
          old=$(curl -sf -H "$auth" "$api/releases/$id/assets" | jq -r --arg n "$file" '.[] | select(.name==$n) | .id')
          [ -n "$old" ] && curl -sf -X DELETE -H "$auth" "$api/releases/assets/$old"
          curl -s --fail-with-body -X POST \
            -H "$auth" -H "Content-Type: application/zip" \
            --data-binary @"$file" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$file"
          echo
          echo "disk published to release: $tag (asset $file)"
