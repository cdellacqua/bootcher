# bootcher CI for GitHub Actions — BUILD + DEPLOY half, multi-arch (x86_64 + aarch64).
#
# Copy this to your bootcher project as `.github/workflows/bootcher-deploy.yml`. Its
# sibling, `provision.yml`, is the disk-building half — see that file. They're split
# because the disk build needs a MANUAL gate, and GitHub Free can't gate a job inside a
# push pipeline (Environment "Required reviewers" is public-repo-only on Free). So the
# build→deploy pipeline below runs automatically on push, and provision is a separate
# `workflow_dispatch` workflow you launch by hand when you actually want a disk.
#
# This file builds both architectures on native runners (no cross-arch emulation) and
# assembles them into one multi-arch image, in two jobs:
#
#   build      — a matrix over the two arches, in parallel, each on a native-arch
#                runner (ubuntu-24.04 / ubuntu-24.04-arm). `bootcher build --target
#                <arch>` builds just that arch's container and stops at the per-arch
#                member tag localhost/<name>:latest-<arch> (NO multi-arch list —
#                `deploy` makes that). The job `podman save`s the member and uploads it
#                as a run artifact. These jobs need NO registry credentials.
#   deploy     — downloads both per-arch members, `podman load`s them, then `bootcher
#                deploy --skip-build` (re)assembles the multi-arch manifest list from
#                them and pushes <registry>/<name>:latest (+ an immutable CalVer tag) to
#                GHCR (this repo's registry). The ONLY job that needs `packages: write`
#                (and the signing key, if enabled). Devices self-update.
#
# A `changes` pre-job path-filters the run: build/deploy fire only when an image input
# changed (Containerfile, sysroot/, the manifests, this workflow), so a docs-only push
# is a no-op. A `v*` tag always builds. See that job for the allowlist to tune.
#
# Why split the build per arch? A multi-arch `bootcher deploy` on a single runner would
# build the foreign arch under qemu-user emulation — slow and occasionally fragile.
# Building each arch on its own native runner is faster and more reliable. The members
# are handed between jobs as run artifacts: the CI owns the `podman save`/`load`, so
# bootcher's own `build`/`deploy` on a dev box are untouched.
#
# Both jobs run inside the published bootcher image (ghcr.io/cdellacqua/bootcher —
# multi-arch, bundles podman + qemu), so there's nothing to install; they need a
# privileged container (podman builds images / loop-mounts the store). GitHub-hosted
# runners allow `--privileged`; no /dev/kvm, so the in-process `local` builder is the
# supported path. Pin `:latest` to a released `:vX.Y.Z` for reproducible builds.
#
# Because each job runs bootcher inside a container, the job's root fs is overlayfs, so
# rootful `podman build`'s store would fall back to fuse-overlayfs (the kernel refuses
# overlay-on-overlay), whose userspace coherence breaks a large `dnf install` — rpm
# "loses" base-provided sonames mid-transaction. The first step of each job sidesteps it
# by relocating the podman store onto a loopback ext4 image: a real fs, so podman does a
# single kernel overlay (no fuse, only deltas — unlike STORAGE_DRIVER=vfs, which ENOSPCs
# on a chromium build). It self-skips on a non-overlay store and needs the privileged
# container (loop mount). Tune the ceiling with BOOTCHER_STORE_SIZE (`df -h` on the
# runner). GitHub workflow YAML has no anchors, so the step is duplicated per job (and in
# provision.yml).
#
# bootcher.toml must (1) point its registry at this repo's GHCR namespace and (2) list
# BOTH arches in [targets], mapped to the disk type each should produce:
#
#   [deploy]
#   registry = "ghcr.io/<owner>"        # lowercase; image is ghcr.io/<owner>/<name>
#
#   [targets]
#   x86_64  = "qcow2"   # a VM image
#   aarch64 = "raw"     # a raw image for an edge device
#
# Every job runs with `--manifest bootcher.ci.toml` — a committed override that
# `extend`s bootcher.toml and forces podman onto the host network, sidestepping
# nested-podman nftables failures in the privileged CI container. Copy
# recipes/ci/bootcher.ci.toml to your project root beside bootcher.toml.
#
# Repository secrets & variables (Settings → Secrets and variables → Actions):
#   SIGN_KEY /       (optional) cosign private key + its passphrase — only if you
#   SIGN_PASSPHRASE  enabled image signing (`bootcher sign enroll`).
# The push credential is the built-in GITHUB_TOKEN — no manual secret needed. The
# provision-only secrets (ADMIN_SSH_PUBKEY, PULL_USER/PULL_TOKEN) live in provision.yml.

name: bootcher deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # --- changes: did anything that affects the image actually change? --------------
  # The build context is the whole project root, so this is an ALLOWLIST of the inputs
  # that actually change the built image: the Containerfile, the sysroot/ overlay baked
  # into it, and the manifests (a registry/target/hook change there re-images too). The
  # `build` job gates on this output; deploy inherits the gate via `needs` (a skipped
  # dependency skips the dependent). So a docs/README-only push no longer spins up the
  # whole multi-arch build → deploy.
  #
  # A cheap pre-job on a plain runner (no container): checkout + a path filter that
  # diffs the push. dorny/paths-filter handles the awkward cases (first commit on a
  # branch, force-push) that a hand-rolled `git diff` gets wrong. Tags bypass it
  # entirely in `build.if` below — a `v*` tag is a deliberate release and always builds.
  #
  # Adjust the `image:` list to YOUR project: if the Containerfile `COPY`s other paths,
  # or a hook script lives outside sysroot/, add them — anything in the build context
  # that ends up in the image belongs here. This workflow file is included so a pipeline
  # edit re-runs it; provision.yml is manual (workflow_dispatch), so it isn't listed.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - Containerfile
              - sysroot/**
              - bootcher.toml
              - bootcher.ci.toml
              - .github/workflows/bootcher-deploy.yml

  # --- build: one container per arch, on a native-arch runner ---------------------
  # `build --target <arch>` builds only that arch and stops at the per-arch member tag
  # localhost/<name>:latest-<arch> (no multi-arch list — `deploy` assembles that). The
  # member is uploaded as a run artifact `deploy` downloads. No registry credentials
  # needed here — only `deploy` pushes.
  build:
    # Gate on the change filter (see the `changes` job); a `v*` tag always builds.
    # deploy needs this job, so a skip here cascades and skips it too.
    needs: [changes]
    if: needs.changes.outputs.image == 'true' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm } # native arm64 runner, no emulation
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged # podman builds the container image (nested)
    steps:
      - uses: actions/checkout@v4
      # Real-fs container store (see the header note): a loopback ext4 so podman does
      # one kernel overlay instead of fuse-overlayfs-on-overlay. Self-skips when the
      # store is already on a real fs.
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          # Breadcrumb: expect `overlay` (kernel); a regression to fuse-overlayfs
          # means the store slipped back onto overlay-on-overlay (rpmdb bug returns).
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      - name: Build ${{ matrix.arch }}
        run: bootcher --manifest bootcher.ci.toml build --target "${{ matrix.arch }}"
      - name: Save image member
        # The build just produced exactly one image tagged `:latest-<arch>`. Save it;
        # the repo:tag is restored on `podman load`, so `deploy` finds the member by
        # name. zstd keeps the artifact small.
        run: |
          set -eu
          img="$(podman images --format '{{.Repository}}:{{.Tag}}' | grep ":latest-${{ matrix.arch }}\$" | head -n1)"
          test -n "$img" || { echo "no built image tagged :latest-${{ matrix.arch }}"; exit 1; }
          podman save "$img" | zstd -T0 -10 -q -o "image-${{ matrix.arch }}.tar.zst"
      - name: Upload image member
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.zst
          retention-days: 1

  # --- deploy: assemble the multi-arch image from the members and push --------------
  # Downloads both per-arch members the build matrix produced, `podman load`s them, then
  # `deploy --skip-build` (re)assembles the multi-arch manifest list and pushes
  # <registry>/<name>:latest (+ a CalVer tag). No container build, no disk step — the
  # only job with `packages: write` (and the signing key, if enabled).
  deploy:
    needs: [build] # waits for every matrix arch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # Real-fs container store (see the header note): a loopback ext4 so podman does
      # one kernel overlay instead of fuse-overlayfs-on-overlay. Self-skips when the
      # store is already on a real fs.
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      # `needs:` doesn't auto-download artifacts on GitHub (unlike GitLab), so fetch
      # every per-arch member into the workspace (flattened) explicitly.
      - name: Download image members
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signing? Materialise the cosign key `[deploy] registry.key` points at:
      # - run: printf '%s' "$SIGN_KEY" > cosign.key
      #   env: { SIGN_KEY: "${{ secrets.SIGN_KEY }}" }
      - name: Load members + deploy
        # Load every per-arch member (restoring its localhost/<name>:latest-<arch> tag),
        # then `--skip-build` (re)assembles the multi-arch list from them and pushes it.
        # `--skip-bootc-upgrade` leaves the rollout to each device's auto-update timer
        # (keeps the admin SSH key out of CI and doesn't assume the runner can reach the
        # fleet). Drop the flag (and add the key) to roll immediately.
        run: |
          for f in image-*.tar.zst; do zstd -dc "$f" | podman load; done
          bootcher --manifest bootcher.ci.toml deploy --skip-build --skip-bootc-upgrade
        env:
          BOOTCHER_SIGN_PASSPHRASE: ${{ secrets.SIGN_PASSPHRASE }}
