# bootcher CI for GitHub Actions — BUILD + DEPLOY half, multi-arch (x86_64 + aarch64).
#
# Recipe docs: https://github.com/cdellacqua/bootcher/tree/main/recipes/ci
#
# Copy this to your bootcher project as `.github/workflows/bootcher-deploy.yml`, and the
# recipe's `scripts/` directory
# (https://github.com/cdellacqua/bootcher/tree/main/recipes/ci/scripts) to `ci/` at your
# repo root: the jobs run `python3 ci/<script>.py`. Its sibling, `provision.yml`, is the
# disk-building half — see that file. They're split
# because the disk build needs a MANUAL gate, and GitHub Free can't gate a job inside a
# push pipeline (Environment "Required reviewers" is public-repo-only on Free). So the
# build→deploy pipeline below runs automatically on push, and provision is a separate
# `workflow_dispatch` workflow you launch by hand when you actually want a disk.
#
# This file builds both architectures on native runners (no cross-arch emulation) and
# assembles them into one multi-arch image, in three jobs (after a `changes` path-gate):
#
#   build      — a matrix over the two arches, in parallel, each on a native-arch
#                runner (ubuntu-24.04 / ubuntu-24.04-arm). `bootcher build --target
#                <arch>` builds just that arch's container and stops at the per-arch
#                member tag localhost/<name>:latest-<arch> (NO multi-arch list —
#                `deploy` makes that). The job PUSHES the member to the registry under a
#                scratch tag (<image>:ci-<arch>) that `deploy` pulls — so it needs
#                `packages: write`. (See "Why the registry, not a run artifact" below.)
#   deploy     — pulls both per-arch members from their scratch tags, retags them to the
#                local member name, then `bootcher deploy --skip-build` (re)assembles the
#                multi-arch manifest list from them and pushes <registry>/<name>:latest
#                (+ an immutable CalVer tag) to GHCR (this repo's registry). Also needs
#                `packages: write` (and the signing key, if enabled). Devices self-update.
#   cleanup    — after a successful deploy, prunes old published versions, keeping
#                `:latest` + the newest KEEP_PREVIOUS CalVer releases. Multi-arch-safe
#                (deletes by digest, preserving the arch children of kept lists); cosign
#                signatures follow their image. See the job for the GITHUB_TOKEN/PAT and
#                dry-run notes.
#
# Neither the image ref nor the arch member names are configured by hand: each job resolves
# them from bootcher.toml at runtime via `bootcher info` (the "Resolve image ref" steps).
#
# A `changes` pre-job path-filters the run: build/deploy fire only when an image input
# changed (Containerfile, sysroot/, the manifests, this workflow), so a docs-only push
# is a no-op. A `v*` tag always builds. See that job for the allowlist to tune.
#
# A weekly schedule rebuilds when the base image moved, so its security updates reach
# the fleet without a commit; a manual run always rebuilds.
#
# Why split the build per arch? A multi-arch `bootcher deploy` on a single runner would
# build the foreign arch under qemu-user emulation — slow and occasionally fragile.
# Building each arch on its own native runner is faster and more reliable.
#
# Why the registry, not a run artifact? The per-arch members are handed between jobs
# through the registry: `build` pushes each to a scratch tag (<image>:ci-<arch>) and
# `deploy` pulls it. A full OS-image member is large (easily >1GB), and a single such run
# artifact can blow the Free plan's ~500MB Actions artifact storage quota on its own —
# after which `upload-artifact` just fails (and expired artifacts aren't GC'd promptly).
# The scratch tags dodge that pool entirely; they share blobs with the :latest list
# `deploy` publishes (identical digests), so they cost ~no extra registry storage and are
# overwritten every run. Tradeoff: `build` now needs `packages: write` (it previously
# needed no registry credentials). This is CI-only — the scratch tags and login live in
# the workflow, so `bootcher build`/`deploy` on a dev box are untouched. NOTE: the stable
# <image>:ci-<arch> tag assumes serial pushes; two overlapping runs could clobber each
# other's member — fine for a low-traffic repo, otherwise scope the tag with the run id.
#
# Both jobs run inside the published bootcher image (ghcr.io/cdellacqua/bootcher —
# multi-arch, bundles podman + qemu), so there's nothing to install; they need a
# privileged container (podman builds images / loop-mounts the store). GitHub-hosted
# runners allow `--privileged`; no /dev/kvm, so the in-process `local` builder is the
# supported path. Pin `:latest` to a released `:vX.Y.Z` for reproducible builds.
#
# Because each job runs bootcher inside a container, the job's root fs is overlayfs, so
# rootful `podman build`'s store would fall back to fuse-overlayfs (the kernel refuses
# overlay-on-overlay), whose userspace coherence breaks a large `dnf install` — rpm
# "loses" base-provided sonames mid-transaction. The first step of each job sidesteps it
# by relocating the podman store onto a loopback ext4 image: a real fs, so podman does a
# single kernel overlay (no fuse, only deltas — unlike STORAGE_DRIVER=vfs, which ENOSPCs
# on a chromium build). It self-skips on a non-overlay store and needs the privileged
# container (loop mount). Tune the ceiling with BOOTCHER_STORE_SIZE (`df -h` on the
# runner). GitHub workflow YAML has no anchors, so the step is duplicated per job (and in
# provision.yml).
#
# bootcher.toml must (1) point its registry at this repo's GHCR namespace and (2) list
# BOTH arches in [targets], mapped to the disk type each should produce:
#
#   [deploy]
#   registry = "ghcr.io/<owner>"        # lowercase; image is ghcr.io/<owner>/<name>
#
#   [targets]
#   x86_64  = "qcow2"   # a VM image
#   aarch64 = "raw"     # a raw image for an edge device
#
# Every job runs with `--manifest bootcher.ci.toml` — a committed override that
# `extend`s bootcher.toml and forces podman onto the host network, sidestepping
# nested-podman nftables failures in the privileged CI container. Copy
# https://github.com/cdellacqua/bootcher/blob/main/recipes/ci/bootcher.ci.toml to your project root beside bootcher.toml.
#
# Repository secrets & variables (Settings → Secrets and variables → Actions):
#   SIGN_KEY /       (optional) cosign private key + its passphrase — only if you
#   SIGN_PASSPHRASE  enabled image signing (`bootcher sign enroll`).
# The push credential is the built-in GITHUB_TOKEN — no manual secret needed. The
# provision-only secrets (ADMIN_SSH_PUBKEY, PULL_USER/PULL_TOKEN) live in provision.yml.

name: bootcher deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Weekly base-image refresh, skipped when the base hasn't moved. Devices reboot into a
  # new build on their update timer: time this ahead of that window.
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch: # an unconditional rebuild of main or a `v*` tag, on demand

# No image ref to configure: every job derives it from bootcher.toml at runtime with
# `bootcher info --format` (see the "Resolve image ref" steps), so the `<registry>/<name>`
# the pipeline tags scratch members and prunes packages by always matches what `deploy`
# publishes — there's no second copy of it to keep in sync, and it follows the `extend`
# chain and the inline-table `[deploy] registry` form that a shell parse would trip over.
env:
  # cleanup keeps :latest + this many previous immutable CalVer releases; older releases
  # (and the per-arch layers only they referenced) are pruned after a successful deploy.
  # Raise it to retain a longer rollback history, or set 0 to keep only :latest.
  KEEP_PREVIOUS: "5"

jobs:
  # --- changes: did anything that affects the image actually change? --------------
  # The build context is the whole project root, so this is an ALLOWLIST of the inputs
  # that actually change the built image: the Containerfile, the sysroot/ overlay baked
  # into it, and the manifests (a registry/target/hook change there re-images too). The
  # `build` job gates on this output; deploy inherits the gate via `needs` (a skipped
  # dependency skips the dependent). So a docs/README-only push no longer spins up the
  # whole multi-arch build → deploy.
  #
  # A cheap pre-job on a plain runner (no container): checkout + a path filter that
  # diffs the push. dorny/paths-filter handles the awkward cases (first commit on a
  # branch, force-push) that a hand-rolled `git diff` gets wrong. Tags bypass it
  # entirely in `build.if` below — a `v*` tag is a deliberate release and always builds.
  # Only a push has a diff to filter: a scheduled run builds if the base moved, a manual
  # one always.
  #
  # Adjust the `image:` list to YOUR project: if the Containerfile `COPY`s other paths,
  # or a hook script lives outside sysroot/, add them — anything in the build context
  # that ends up in the image belongs here. This workflow file is included so a pipeline
  # edit re-runs it; provision.yml is manual (workflow_dispatch), so it isn't listed. Nor
  # is ci/: its scripts don't change the image. An edited cleanup script runs at the
  # next deploy (a manual run always deploys). The base and release checks run only on
  # the schedule, which can't be triggered by hand: test an edit by running the script
  # locally (both only read registries; base_check.py needs IMAGE, plus CHANNEL for a
  # channel).
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read # the base-image check reads the published image
    outputs:
      ref: ${{ steps.base.outputs.SOURCE_REV }} # a refresh's commit; empty → the trigger's
      # push → the path filter; schedule → the base-image check; manual → always, but only
      # on main or a `v*` tag (anything else would publish an arbitrary branch).
      image: >-
        ${{ (github.event_name == 'workflow_dispatch'
        && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        || (github.event_name == 'push' && steps.filter.outputs.image == 'true')
        || (github.event_name == 'schedule' && steps.base.outputs.BASE_CHANGED == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            image:
              - Containerfile
              - sysroot/**
              - bootcher.toml
              - bootcher.ci.toml
              - .github/workflows/bootcher-deploy.yml
      # Scheduled runs: ci/base_check.py compares the base digest buildah recorded in each
      # published member with the base tag's current one; anything uncheckable rebuilds.
      # Also emits the commit :latest ships (SOURCE_REV), which build/deploy rebuild. A
      # private base image needs its own `skopeo login`.
      - name: Resolve image ref
        if: github.event_name == 'schedule'
        run: |
          set -eu
          image="$(docker run --rm -v "$PWD:/w" -w /w ghcr.io/cdellacqua/bootcher:latest \
            --manifest bootcher.ci.toml info --format '{{ .Image }}')"
          test -n "$image" || { echo "no registry in bootcher.toml [deploy] — these CI recipes are registry-mode only (see https://github.com/cdellacqua/bootcher/tree/main/recipes/ci)"; exit 1; }
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether the base image moved
        if: github.event_name == 'schedule'
        id: base
        run: python3 ci/base_check.py

  # --- release-check: is the pinned Fedora release still supported? (schedules only)
  # The Containerfile pins fedora-bootc to one Fedora release (`ARG FEDORA_VERSION`). Its
  # tag stops moving at end of life, and from then on the base check above never sees a
  # change, so the fleet would stop getting security updates with every run green. This
  # job fails once the pin is two releases behind (at or within weeks of end of life) and
  # warns while it's one behind. It gates nothing: a failure here is the alert, not a
  # reason to skip a rebuild. It reads the pin from `ARG FEDORA_VERSION`; adapt the two
  # settings at the top of ci/release_check.py if your Containerfile or base differ.
  release-check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the pinned Fedora release
        run: python3 ci/release_check.py
        env:
          WARNING_PREFIX: "::warning::" # one release behind: an annotation on the run...
          BEHIND_EXIT_CODE: "0" # ...and the run stays green

  # --- build: one container per arch, on a native-arch runner ---------------------
  # `build --target <arch>` builds only that arch and stops at the per-arch member tag
  # localhost/<name>:latest-<arch> (no multi-arch list — `deploy` assembles that). The
  # member is pushed to the registry under a scratch tag (<image>:ci-<arch>) that
  # `deploy` pulls, so this job needs `packages: write` (see the header for why it's not
  # a run artifact).
  build:
    # Gate on the change filter (see the `changes` job); a `v*` tag always builds.
    # deploy needs this job, so a skip here cascades and skips it too.
    needs: [changes]
    if: needs.changes.outputs.image == 'true' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm } # native arm64 runner, no emulation
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push each per-arch member to the registry (was artifact-only)
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged # podman builds the container image (nested)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.ref }}
          fetch-tags: true # so `git describe` still names the release
      # The runner creates the workspace as its own user, but this job runs as root: hand
      # it the checkout, or git refuses it ("dubious ownership") and the image loses its
      # git provenance (revision/version labels, the CalVer tag's commit suffix).
      - name: Own the checkout
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      # Real-fs container store (see the header note): a loopback ext4 so podman does
      # one kernel overlay instead of fuse-overlayfs-on-overlay. Self-skips when the
      # store is already on a real fs.
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          # Breadcrumb: expect `overlay` (kernel); a regression to fuse-overlayfs
          # means the store slipped back onto overlay-on-overlay (rpmdb bug returns).
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      - name: Resolve image ref
        # Derive the ref from bootcher.toml instead of hardcoding it: `bootcher info` prints
        # the same resolved <registry>/<name> `deploy` publishes — it follows the extend
        # chain and the inline-table `[deploy] registry` form, so a shell copy can't drift.
        # IMAGE is the base for the :ci-<arch> scratch tags. Empty ⇒ LAN mode (no `[deploy]
        # registry`); these recipes are registry-mode only, so fail loudly here, before the
        # multi-minute build, rather than at the push step.
        run: |
          set -eu
          image="$(bootcher --manifest bootcher.ci.toml info --format '{{ .Image }}')"
          test -n "$image" || { echo "no registry in bootcher.toml [deploy] — these CI recipes are registry-mode only (see https://github.com/cdellacqua/bootcher/tree/main/recipes/ci)"; exit 1; }
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.arch }}
        run: bootcher --manifest bootcher.ci.toml build --target "${{ matrix.arch }}"
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image member to the registry
        # The build just produced exactly one image tagged `:latest-<arch>`. Push it under
        # a scratch tag ($IMAGE:ci-<arch>) that `deploy` pulls — the build→deploy handoff
        # goes through the registry, not a run artifact (see the header for why). Unsigned:
        # a CI-internal intermediate no device pulls; only :latest is signed (in deploy).
        run: |
          set -eu
          img="$(podman images --format '{{.Repository}}:{{.Tag}}' | grep ":latest-${{ matrix.arch }}\$" | head -n1)"
          test -n "$img" || { echo "no built image tagged :latest-${{ matrix.arch }}"; exit 1; }
          scratch="$IMAGE:ci-${{ matrix.arch }}"
          podman tag "$img" "$scratch"
          podman push "$scratch"

  # --- deploy: assemble the multi-arch image from the members and push --------------
  # Pulls both per-arch members the build matrix pushed to their scratch tags, retags
  # them, then `deploy --skip-build` (re)assembles the multi-arch manifest list and pushes
  # <registry>/<name>:latest (+ a CalVer tag). No container build, no disk step. Needs
  # `packages: write` (and the signing key, if enabled) to push :latest.
  deploy:
    needs: [changes, build] # build waits for every matrix arch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.ref }}
          fetch-tags: true # so `git describe` still names the release
      # The runner creates the workspace as its own user, but this job runs as root: hand
      # it the checkout, or git refuses it ("dubious ownership") and the image loses its
      # git provenance (revision/version labels, the CalVer tag's commit suffix).
      - name: Own the checkout
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      # Real-fs container store (see the header note): a loopback ext4 so podman does
      # one kernel overlay instead of fuse-overlayfs-on-overlay. Self-skips when the
      # store is already on a real fs.
      - name: Prepare container store
        run: |
          set -eu
          if [ "$(stat -f -c %T / 2>/dev/null)" = "overlayfs" ]; then
            : "${BOOTCHER_STORE_SIZE:=20G}"
            img=/bootcher-store.img
            truncate -s "$BOOTCHER_STORE_SIZE" "$img"
            mkfs.ext4 -q -F "$img"
            mkdir -p /var/lib/containers/storage
            mount -o loop "$img" /var/lib/containers/storage
            echo "relocated podman store onto loopback ext4 (${BOOTCHER_STORE_SIZE} ceiling)"
          else
            echo "container store already on a real fs; skipping loopback store"
          fi
          podman info --format 'podman store: {{.Store.GraphDriverName}} @ {{.Store.GraphRoot}}'
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image ref
        # Same derivation as the build jobs (see there). IMAGE is the scratch-tag base;
        # NAME is the local member basename `deploy --skip-build` retags to.
        run: |
          set -eu
          image="$(bootcher --manifest bootcher.ci.toml info --format '{{ .Image }}')"
          test -n "$image" || { echo "no registry in bootcher.toml [deploy] — these CI recipes are registry-mode only (see https://github.com/cdellacqua/bootcher/tree/main/recipes/ci)"; exit 1; }
          {
            echo "IMAGE=$image"
            echo "NAME=$(bootcher --manifest bootcher.ci.toml info --format '{{ .Name }}')"
          } >> "$GITHUB_ENV"
      # Pull each per-arch member `build` pushed under its scratch tag and retag it to the
      # local name `deploy --skip-build` expects — localhost/<name>:latest-<arch>, where
      # <name> is the project name — so the list is assembled from them exactly as before,
      # just sourced from the registry, not a run artifact. Keep this arch list in sync
      # with the build matrix above.
      - name: Pull image members from the registry
        run: |
          set -eu
          for arch in x86_64 aarch64; do
            scratch="$IMAGE:ci-$arch"
            podman pull "$scratch"
            podman tag "$scratch" "localhost/$NAME:latest-$arch"
          done
      # Signing? Materialise the cosign key `[deploy] registry.key` points at:
      # - run: printf '%s' "$SIGN_KEY" > cosign.key
      #   env: { SIGN_KEY: "${{ secrets.SIGN_KEY }}" }
      - name: Deploy
        # The members were pulled + retagged to localhost/<name>:latest-<arch> above, so
        # `--skip-build` (re)assembles the multi-arch list from them and pushes it.
        # `--skip-bootc-upgrade` leaves the rollout to each device's auto-update timer
        # (keeps the admin SSH key out of CI and doesn't assume the runner can reach the
        # fleet). Drop the flag (and add the key) to roll immediately.
        run: |
          bootcher --manifest bootcher.ci.toml deploy --skip-build --skip-bootc-upgrade
        env:
          BOOTCHER_SIGN_PASSPHRASE: ${{ secrets.SIGN_PASSPHRASE }}

  # --- cleanup: prune old published image versions ----------------------------------
  # Each deploy publishes a fresh multi-arch `:latest` list plus an immutable `:<CalVer>`
  # tag, so the GHCR package grows one release every push. This job runs ONLY after a
  # successful deploy (`needs: [deploy]`) and keeps `:latest` + the newest KEEP_PREVIOUS
  # CalVer releases (set at the top of this file), deleting older ones so the package
  # doesn't grow without bound.
  #
  # Multi-arch SAFETY — the reason this isn't a one-line "keep N, delete the rest": GHCR
  # stores every arch's child manifest as its OWN version, usually untagged, so a naive
  # count/age prune would delete the arch members of the very release you're keeping and
  # corrupt it. ci/ghcr_cleanup.py prunes by digest instead, never prunes a channel
  # (`latest` + any `[deploy] channels`) or `ci-<arch>` scratch tag by age, and keeps each
  # cosign signature with its image; its docstring has the details.
  #
  # Token: the built-in GITHUB_TOKEN with `packages: write` deletes versions of a package
  # LINKED to this repo (Package settings → Manage Actions access → this repo, or push it
  # from here first). If the package is org-owned and the token is refused (403), set a
  # CLEANUP_TOKEN secret (a PAT/GitHub App token with `delete:packages`) and swap it into
  # `GH_TOKEN` below. First run? Flip DRY_RUN to "true" to log what WOULD be deleted
  # without deleting anything, confirm the keep/delete split, then set it back.
  #
  # Runs in the bootcher image for `bootcher info` + python3 (both bundled; the script is
  # stdlib only); no `--privileged` and no container store — it only calls the GitHub API
  # and the registry.
  cleanup:
    needs: [deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # delete old package versions
    container:
      image: ghcr.io/cdellacqua/bootcher:latest
    steps:
      - uses: actions/checkout@v4
      - name: Prune old image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # see the token note above (PAT fallback)
          DRY_RUN: "false" # "true" = log the plan without deleting (validate a first run)
        run: python3 ci/ghcr_cleanup.py
