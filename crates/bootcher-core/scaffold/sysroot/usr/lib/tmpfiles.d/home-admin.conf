d /var/home/admin 0700 admin admin - -
d /var/home/admin/.ssh 0700 admin admin - -
# Point the conventional `~/.ssh/authorized_keys` at the real, provision-managed
# key file (`AuthorizedKeysFile /etc/ssh/authorized_keys.d/%u`) so anyone who looks
# in the home directory — the habitual place — finds the keys instead of an empty
# dir. sshd still reads the /etc path directly; this is for discoverability. `L`
# (not `L+`) so a real authorized_keys an admin later creates is never clobbered.
L /var/home/admin/.ssh/authorized_keys - - - - /etc/ssh/authorized_keys.d/admin
