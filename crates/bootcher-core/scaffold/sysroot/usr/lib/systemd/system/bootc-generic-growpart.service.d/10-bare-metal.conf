# Let fedora-bootc's first-boot root-grow run on physical hardware too.
#
# The base image ships bootc-generic-growpart.service (growpart + systemd-growfs
# on /sysroot), wired into local-fs.target, but gates it on
# `ConditionVirtualization=vm` — upstream deliberately skips bare metal. bootcher
# images are flashed straight onto physical SD cards / USB sticks for SBCs, where
# the root filesystem must still expand to fill the card on first boot.
#
# An empty assignment resets the condition list, so the service runs everywhere.
# Its other conditions still apply: it only acts when /sysroot is a mountpoint and
# growpart exists, and growpart reports NOCHANGE (a no-op) once the partition
# already fills the disk — so this is safe on every boot and in VMs alike. Because
# systemd-growfs dispatches on the filesystem type, this grows ext4/xfs/btrfs
# (the manifest's `rootfs` choices) without bootcher touching the host.
[Unit]
ConditionVirtualization=
