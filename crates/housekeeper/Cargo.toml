[package]
name = "housekeeper"
# Standalone, never inherited: this dev-only tool bumps the *workspace* version,
# so it must not carry `version.workspace = true` (it would rewrite its own
# version every time it runs). Pinned at 0.0.0 and never released.
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "housekeeper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
# Both already in the workspace lockfile transitively, so depending on them here
# adds no new crates to the build graph.
semver = "1"
toml_edit = "0.25"

[lints]
workspace = true
